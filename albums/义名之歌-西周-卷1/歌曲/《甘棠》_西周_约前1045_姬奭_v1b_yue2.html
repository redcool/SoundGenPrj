<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/16\r\nQ:1/4=104\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:C\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"Fmaj7\"z16|\"Em7\"z16|\"Dm7\"z16|\r\nV: Ins\r\nz12z2ge|e4z2g2a2c'2a2g2|e8z4d2e2|c4z2A2c2d2g4|\r\nV: Vocal\r\n\"C\"z16|\"Fmaj7\"z16|\"Em7\"z16|\"Dm7\"z16|\r\nV: Ins\r\ne8z2GAc2d2|e4z2g2a2c'2a2g2|e6d2c4A4|d8z4e4|\r\nV: Vocal\r\n\"C\"z16|\r\nV: Ins\r\nc16|\r\n% verse\r\nV: Vocal\r\n\"Fmaj7\"E2E2G2A2c2A2G2E2|\"Em7\"G4z6E2D2C2|\"Dm7\"D3D3E2D2C2C2A,2|\"C\"E4z8E2E2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A,4E2E2A,2z2D2C2|\"Em7\"G3G3z6A,2C2|\"Dm7\"D2D2D2z2D2C2A,2C2-|\"C\"C2z8z2E2G2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A3A3z2c2A2G2E2|\"Em7\"G4z8z2A,2|\"Dm7\"D2D4E2D2C2A,2C2|\"C\"C4z12|\r\nV: Ins\r\nZ3|z6d'c'g2e2d2c2|\r\nV: Vocal\r\n\"C\"E2E2G2A2c2A2G2E2|\"Em7\"G4z6E2D2C2|\"Dm7\"D3D3z2D2C2A,2E2-|\"C\"E4z8E2E2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,2A,2E2E2A,2A,2D2C2|\"Em7\"G3G3z4EED2C2|\"Dm7\"D4z6E2D2C2|\"G\"D3D3z4EED2C2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A,4C2D2E4D2C2|\"Em7\"G3E3D2E4A,2C2|\"Dm7\"D4z6EED2C2|\"C\"D3C4z8z|\r\nV: Ins\r\nZ3|z8z2GAc2d2|\r\n% chorus\r\nV: Vocal\r\n\"Fmaj7\"e2e2A2A2e2e2A2A2|\"Em7\"d2d2G2G2d2d2G2G2|\"Dm7\"d2d2A2A2d3c3A2|\"C\"e8z4c2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"e4z6e2d2c2|\"Em7\"d3c3A2G4z4|\"Dm7\"z16|\"C\"z16|\r\nV: Ins\r\nZ|z12e2d2|c6A2c4d4|c16|\r\n% verse\r\nV: Vocal\r\n\"C\"E2E2G2A2c2A2G2G2-|\"Em7\"G2z8z2E2E2|\"Dm7\"D4D2E2D3C3A,2|\"C\"E4z12|\r\nV: Ins\r\nZ3|z6edA2G2E2D2|\r\nV: Vocal\r\n\"Am\"E2E2E2A,2E2E2D2C2|\"Em7\"G2G2E2E2G2G2E2E2|\"Dm7\"D2D2C2C2D2D2C2C2|\"C\"D2E2D2C2D4E4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"z16|\"C\"EEEEE2EEG2G2G2E2|\"Em7\"DDDDDDDDDDEDD4|\"Dm7\"DDD2D4DDEDD3C|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"EDEDE4EDE2C4|\"Am\"E2E2E2EEEEEED2C2|\"Em7\"G2G2G2E4z6|\"Dm7\"D3D8zD2C2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"C4z12|\r\nV: Ins\r\nz8z2GAc2d2|\r\n% interlude\r\nV: Vocal\r\n\"Fmaj7\"z16|\"Em7\"z16|\"Dm7\"z16|\"C\"z16|\r\nV: Ins\r\ne8z4g4|d8z4e4|c12d4|e8z2GAc2d2|\r\nV: Vocal\r\n\"Fmaj7\"z16|\"Em7\"z16|\"Dm7\"z16|\"C\"z16|\r\nV: Ins\r\ne8z4g4|d8z4e4|c8z8|z8z2GAc2d2|\r\n% verse\r\nV: Vocal\r\n\"Fmaj7\"E2E2G2A2c2A2G2E2|\"Em7\"G3G3z4E2D2C2|\"Dm7\"D2D2D2C2D2C2A,2E2-|\"C\"E2z8z2E2E2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,2A,2E2E2A,2A,A,D2C2|\"Em7\"G3G4z3DED2C2|\"Dm7\"D4z6E2D2C2|\"G7\"D3D3C2D2E2D2C2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"C4z12|\r\nV: Ins\r\nZ|\r\n% chorus\r\nV: Vocal\r\n\"Fmaj7\"e2e2A2A2e2e2A2A2|\"Em7\"d2d2G2G2d2d2G2G2|\"Dm7\"d2d2A2A2d3c3A2|\"C\"e8z4c2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"e4z6e2d2c2|\"Em7\"d3c3A2G4z4|\"Dm7\"z16|\"C\"z16|\r\nV: Ins\r\nZ|z12e'2d'2|c'6a2c'4d'4|c'16|\r\nV: Vocal\r\n\"Fmaj7\"e2e2A2A2e2e2A2A2|\"Em7\"d2d2G2G2d2d2G2G2|\"Dm7\"d2d2A2A2d3c3A2|\"C\"e8z4c2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"e4z6e2d2c2|\"Em7\"d3c3A2G4z4|\"Dm7\"z16|\"C\"z16|\r\nV: Ins\r\nZ|z12e'2d'2|c'6a2c'4d'4|c'16|\r\nV: Vocal\r\n\"Fmaj7\"e2e2A2A2e2e2A2A2|\"Em7\"d2d2G2G2d2d2G2G2|\"Dm7\"d2d2A2A2d3c3A2|\"C\"e8z4c2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"e4z6e2d2c2|\"Em7\"d3c3A2G4z4|\"Dm7\"D3D3E2D4z4|\"Dm7\"z8E3D3E2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C6\"D3C8z4z|\r\nV: Ins\r\nz8z3Ac2d2|\r\n% outro\r\nV: Vocal\r\n\"Fmaj7\"z16|\"Em7\"z16|\"Dm7\"z16|\"C\"z16|\r\nV: Ins\r\ne4z2g2a2c'2a2g2|e8z4d2e2|c4z2A2c2d2g4|e8z2GAc2d2|\r\nV: Vocal\r\n\"Fmaj7\"z16|\"Em7\"z16|\"Dm7\"z16|\"C\"z16|\r\nV: Ins\r\ne4z2g2a2c'2a2g2|e6d2c4A4|d12e4|c16|\r\nV: Vocal\r\n\"C\"z16|\r\nV: Ins\r\nZ|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
