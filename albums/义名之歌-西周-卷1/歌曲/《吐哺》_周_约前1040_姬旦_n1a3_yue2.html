<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/16\r\nQ:1/4=85\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:G\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ2|\"Em\"z16|\"D\"z16|\r\nV: Ins\r\nZ2|e'8b'6a'g'|a'8z4b'2d'2|\r\nV: Vocal\r\n\"C\"z16|\"Bm\"z16|\"Em\"z16|\"D\"z16|\r\nV: Ins\r\ne'6g'2a'2b'2e'2d'2|b12B2d2|e6z2b4a2g2|a8z4b2d'2|\r\nV: Vocal\r\n\"C\"z8\"D\"z8|\"Em\"z16|\"Em\"z16|\"D\"z16|\r\nV: Ins\r\ne'6g'2f'2e'2d'4|e'16|Z2|\r\nV: Vocal\r\n\"C\"z16|\"G\"z16|\"Am\"z16|\"Em\"z16|\r\nV: Ins\r\nZ2|A4z12|Z|\r\nV: Vocal\r\n\"C\"z8\"D\"z8|\"Em\"z16|\"C\"z8\"D\"z8|\"Em\"z12B,2D2|\r\nV: Ins\r\nZ|z8e4b4|a6g2f4d4|e12z4|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2B,2z6E2E2D2|\"D\"E2B,2z8B,2DD|\"C\"E4z6E2E2D2|\"G\"E2B,2z8B,2DD|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"E4z2EDE2D2E2ED|\"Em\"E4z8E2G2|\"C\"AAAAA2AB\"D\"A3F3D2|\"Em\"E4z8z2B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,2A,2A,2A,2A,2A,2B,2D2|\"Em\"E4z6B,2B,2D2|\"C\"E2E2E2EG\"D\"F4D2DD-|\"Em\"D2E4z8z2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"EEE2E2zE2EE2E2D2|\"D\"E2E2E2zE2EE2E2B,D|\"C\"EEE2E2EDEDE2z2ED|\"G\"E2D2z2B,A,B,2B,2z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,A,A,G,A,2A,2A,G,A,2A,2z2|\"Em\"B,B,B,A,B,2B,A,B,B,B,A,B,2D2|\"C\"E8\"D\"F6D2|\"Em\"E8z4B2d2|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4B4\"D\"A2z2B2d2|\"C\"e4B4\"G\"B2z2B2AG|\"Am\"A2A6\"D\"A3B3d2|\"G\"B8\"B\"z4B2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4B4\"D\"A2z2B2d2|\"C\"e4B4\"G\"B2z2BBAG|\"Am\"A2A6\"D\"A3G3F2|\"Em\"F2E8z6|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"Em\"EEEEE2DE2DE2E2D2|\"D\"EDE2E2zE2DE2E2z2|\"C\"EEEDEDEDE2zDE2E2|\"G\"DD2B,3B,A,B,2B,2z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,A,A,G,A,2A,2A,2A,2B,B,B,D|\"Em\"E4z8z2B,2|\"C\"E3E3G2\"D\"F4DDDD|\"Em\"E8z6G,G,|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G,G,G,G,G,G,G,G,G,G,2G,2zG,G,|\"D\"G,G,2G,G,G,G,G,G,G,G,G,G,G,G,2|\"C\"G,G,G,G,G,2G,G,G,2G,2G,G,G,2|\"G\"G,G,G,2G,2G,2z4zG,G,G,|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"G,2G,2z8zG,G,G,|\"Em\"G,2G,2z8z2E,2|\"C\"E,E,E,2E,E,E,D,E,2z6|\"Em\"E,E,E,E,E,D,E,D,E,2z4B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,A,A,A,A,2A,G,A,2A,G,A,2A,2|\"Em\"A,G,A,G,A,G,A,G,A,G,A,2A,G,A,B,|\"C\"A,G,A,G,A,2A,G,\"D\"A,2A,2A,G,A,B,|\"Em\"A,2E,D,D,2E,4z2B2d2|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4B4\"D\"A2z2B2d2|\"C\"e4B4\"G\"B2z2B2G2|\"Am\"A2A3AAG\"D\"A3B3d2|\"G\"B8\"B\"z4B2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4B4\"D\"A2z2B2d2|\"C\"e4B4\"G\"B2z2B2G2|\"Am\"A2A4AG\"D\"A3G3F2|\"Em\"E8z8|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"Em\"DEEDE2DE2DE2E2ED|\"D\"EDEDE2DE3E2zEED|\"C\"E2EDEDEDE2E2EDE2|\"G\"EDEDEDEDB,2B,2z3B,|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,2A,A,A,2A,G,A,2A,2z4|\"Em\"B,B,B,A,B,2B,2z6B,D|\"C\"E3E3G2\"D\"F4D4|\"Em\"E8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G,G,G,G,G,2G,G,G,G,G,2G,G,G,G,|\"D\"G,G,G,G,G,2G,G,G,2z3G,G,G,|\"C\"G,2G,G,G,2G,2G,G,G,2G,2G,G,|\"G\"G,2G,2G,2G,G,G,2z3G,G,G,|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"G,G,G,2z4G,2G,2z3G,|\"Em\"G,2E,2z8z2G,B,|\"C\"E3E3G2\"D\"F4D4|\"Em\"E8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"GGG2GGGGGGG2GGGG|\"D\"G2GGGGG2G2z4GG|\"C\"GGGGGGG2G2GGGGGG|\"G\"G2GGGGG2G2z3GGG|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"GGG2z3GGGGGG2zG|\"Em\"GGGGG2GGG2G2z4|\"C\"z8\"D\"z8|\"Em\"z16|\r\nV: Ins\r\nZ|z12B4|e8f6d2|e16|\r\nV: Vocal\r\n\"Em\"EEEDE2DE3E2EDED|\"D\"E2E2E2D2E2z6|\"C\"EEEDEDEDE2EDE2ED|\"G\"EDEDB,2B,2z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,A,A,2A,2A,G,A,2A,2A,G,A,2|\"Em\"B,4z8z2B,D|\"C\"E6G2\"D\"F4D4|\"Em\"E8z4B2d2|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4B4\"D\"A2z2B2d2|\"C\"e4B4\"G\"B2z2B2G2|\"Am\"A2A3GAG\"D\"A3B3d2|\"G\"B8\"Bm\"z4B2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4B4\"D\"A2z2B2d2|\"C\"e4B4\"G\"B2z2B2G2|\"Am\"A2A4AG\"D\"A3G3F2|\"Em\"E8z8|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"Em\"EEEEE2DE3E2EDED|\"D\"EDEDEDE2z4zDED|\"C\"E2E2EDEDE2EDE2ED|\"G\"E2EDB,2B,2z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,A,A,G,A,2A,G,A,2A,2A,G,A,G,|\"Em\"B,2B,2z12|\"C\"E3E3G2\"D\"F4D4|\"Em\"E8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"z16|\r\nV: Ins\r\nZ|\r\n% interlude\r\nV: Vocal\r\n\"Em\"z16|\"D\"z16|\"C\"z16|\"G\"z16|\r\nV: Ins\r\ne8b4a2g2|a12b2d2|e6g2a2b2e2d2|B16|\r\nV: Vocal\r\n\"Am\"z16|\"Em\"z16|\"C\"z8\"D\"z8|\"Em\"z16|\r\nV: Ins\r\nA8z8|B8e4b4|a6g2f4d4|e16|\r\nV: Vocal\r\n\"Em\"z16|\"D\"z16|\"C\"z16|\"G\"z16|\r\nV: Ins\r\ne8b4a2g2|a12b2d2|e6g2a2b2e2d2|B16|\r\nV: Vocal\r\n\"Am\"z16|\"Em\"z16|\"C\"z8\"D\"z8|\"Em\"z16|\r\nV: Ins\r\nA16|B8e4b4|a6g2f4d4|e16|\r\n% outro\r\nV: Vocal\r\n\"Em\"z16|\"D\"z16|\"C\"z16|\"G\"z16|\r\nV: Ins\r\ne'8b'4a'2g'2|a'12b'2d'2|e'6g'2a'2b'2e'2d'2|b16|\r\nV: Vocal\r\n\"Am\"z16|\"Em\"z16|\"C\"z8\"D\"z8|\"Em\"z16|\r\nV: Ins\r\na16|b8e'4b'4|a'6g'2f'4d'4|e'16|\r\nV: Vocal\r\n\"Em\"z16|\r\nV: Ins\r\nZ|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
