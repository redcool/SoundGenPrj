<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=75\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:C\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"C\"z32|\"Am\"z32|\"F\"z32|\r\nV: Ins\r\nZ|z8E4G4G8E4D2C2|E2E2z16z4D2E2D2C2|A,8z4C4D8D4C4|\r\nV: Vocal\r\n\"C\"z32|\r\nV: Ins\r\nC32|\r\n% verse\r\nV: Vocal\r\n\"C\"E2G4G2G4E4A4G4G4E2D2|\"Am\"C8z16z4A,2C2|\"F\"D4C2D4C2D2C2D2C2D2C6G2E2|\"C\"E8z16z6A,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"c2c4c2c4c2A2c4A2A4z2A2G2|\"Em\"A2G2G2G4E2E2G2E4z8A,2C2-|\"F\"C2A,2D2C2D2C4A,4A,2A,2A,2E4D2D2-|\"C\"D2C6z16z4A,2C2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F\"D2D4z4D2D2C2D4C2D4D4z2|\"F\"z8z2A,2A,2A,2E4G8D4|\"C\"C8z24|\"C\"E2G4G2G4E4A2G4G6E2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"C8z16z4A,2C2|\"F\"D4D2C2D4C4D4D2C2D4D2C2|\"C\"G4E8z16c2A2|\"Am\"c4c2A2A4A2G2A2A4G2A2G2E4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G2G4G6E2D2E4z6A,2A,2C2|\"F\"D2D4C6A,2C2\"G\"D2C2D2C2D2E6|\"C\"D4C8z16z4|\r\nV: Ins\r\nZ3|\r\n% pre-chorus\r\nV: Vocal\r\n\"Am\"A,2C2A,2C4A,2C2A,2C4A,2C4A,4A,2|\"Em\"G4G4E8z16|\"F\"D2D2D2D6z2C2D2D2D2D4z2D2C2|\"G\"D4D2C2D4D2E2G4E4z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"c2c2c2A2c4A2G2A2G4A4G2A2G2|\"Em\"A2G2G4E2D2G4E4z8A,2C2|\"F\"D2C4z2D2C2D2C2\"G\"D2D4z6D2C2|\"G\"D4D2C2D4C4E4E4D4C4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"C8z16A2c6|\r\nV: Ins\r\nZ|\r\n% chorus\r\nV: Vocal\r\n\"C\"c4e16z4d2d6|\"Am\"d2c2c8z16A2c2|\"F\"d16z4e4d4c4|\"C\"e8z16A2c6|\r\nV: Ins\r\nZ|z12c2d2e8g4z4|Z|z8e2e2d2c2e8z8|\r\nV: Vocal\r\n\"Am\"c4e16z4d2d4e2|\"Em\"d2c2A2G6z16z4|\"F\"A4G2A4G6\"G\"z8E4D2D2-|\"C\"D2C6z16z6G,2|\r\nV: Ins\r\nZ|z12e2g2a8g8|Z|z16E4G4E4D2z2|\r\n% verse\r\nV: Vocal\r\n\"C\"E2G4G2E4G4A2G4E4E2E2D2|\"Am\"D4C4C2C2C2D2E4z12|\"F\"D2D2D2D6D4D2C4D6C4|\"C\"D2E4E6E4A4G2E6G4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A8z12z2A,2A,4A,2G2|\"Em\"E8z16z4E4|\"F\"D8z8\"G\"z8D2C2E4|\"C\"C8z24|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"c2c4A2c2A4c6A4A4G4|\"Em\"A4G2E6z16z2C2|\"F\"D4D2D4D6D2D4C2G4E4-|\"C\"E4z24z4|\r\nV: Ins\r\nZ3|z8E4G4A8c8|\r\nV: Vocal\r\n\"Am\"c2A6A2G2A2G6A2G4E4E2|\"Em\"A2G2G2G2G4E2D2E8z8|\"F\"D2D4C2D2C2D2D2-\"G\"D4z12|\"C\"D4C4z4C4C4z12|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"C2C4C4A,2C4C4C2C2C2E4D2|\"Am\"D4C8D4E8z8|\"F\"D2D2D2D6D2C2D2C2D2C4D6|\"C\"E2E2E2E4E2E2E2G4E4A2G2G2E2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"c2c2c2A2A4A2G2A4A2G2A4G2E2|\"Em\"E8z16z4A,2C2|\"F\"D4D6D2D2C2\"G\"D2D4D6z4|\"G\"E4E4D4C2C2-\"C\"C6z8z2|\r\nV: Ins\r\nZ|z12E2G2A8G4z4|Z|z24D2E2D2C2|\r\nV: Vocal\r\n\"C\"z24A2c6|\r\nV: Ins\r\nE16z16|\r\n% chorus\r\nV: Vocal\r\n\"C\"c4e16z4d2d6|\"Am\"d4c8z12A2c4c2|\"F\"d4d2d12z2e4d4c4|\"C\"e8z16A2c6|\r\nV: Ins\r\nZ|z12c2d2e2e2z12|Z|z8e4d2c2e8z8|\r\nV: Vocal\r\n\"Am\"c4e16z4d2d4e2|\"Em\"d2c2A2G6z16A,2C2|\"F\"D2D4D6D2C2\"G\"E8E4D4|\"C\"C8z24|\r\nV: Ins\r\nZ|z12e2g2a8g4z4|Z|z8d2e2d2c2c16|\r\n% verse\r\nV: Vocal\r\n\"C\"c2A4A6A2G2A4A2G2A4G2G2-|\"Am\"G2E6z16z6A,2|\"F\"D2D2D2D6D2C2\"G\"D4z4D2C4G2-|\"C\"G4E8z16A2A2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"c4c2A2A8A2A4G2A4A2G2|\"Em\"A4G2E2G4G2E2G4E4z8|\"F\"D2C2D2D6D2C2\"G\"D4E8D4|\"C\"C8z16z6A,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F\"D2C2D2C2D4D2C2\"G\"D16|\"G\"z16E4E4D4D4|\"C\"C8z16z6A,2|\"Am\"A,2C2C2A,2C2C2A,2C4A,6A,2A,2A,2A,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G2G4E8z16z2|\"F\"D2D2D2D6z4D2D2D2D6D2C2|\"G\"D4D4D4E2G6E12|\"G\"G16z8A,2C6|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"C\"D4C4E2E4D2E4z4A,2C6|\"Am\"D4E4E2E4D2E4z4A,2C6|\"F\"D8E8\"G\"D12C4|\"C\"E16z8A,2C6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"D4E4E2E4D2E4z12|\"Em\"A4G4G4E2G4E8z2D2C2|\"F\"D16\"G\"z8E2D2D4|\"C\"C16z8A2c6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"d4e16z4d2d6|\"Am\"d4c8z16A2c2|\"F\"d16z4e4d4c4|\"C\"e8z16A2c6|\r\nV: Ins\r\nZ|z12c2d2e8g4z4|Z|z8e4d2c2e8z8|\r\nV: Vocal\r\n\"Am\"d4e16z4d2d4e2|\"Em\"d2c2A2G6z16z4|\"F\"A4G2A4G6\"G\"z8E4D2D2-|\"C\"D2C6z16A2c6|\r\nV: Ins\r\nZ|z12e2g2a8g8|Z|z8e4d2c2c8z8|\r\nV: Vocal\r\n\"C\"d4e4e2e4d2e4z4d2d6|\"Am\"d4c4e2e4d2e4z4A2c6|\"F\"d8e8\"G\"d12c4|\"C\"e8z16A2c6|\r\nV: Ins\r\nZ3|z8e4d2c2e8z8|\r\nV: Vocal\r\n\"Am\"d4e4e2e4d2e4z12|\"Em\"a4g4g4e2g4e8z2d2c2|\"F\"d16\"G\"z8e2d2d4|\"C\"c16z8A,2C6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"D4E4E2E4D2E4z4D2D6|\"Am\"D4C4E2E4D2E4z4A,2C6|\"F\"D8E8\"G\"D12C4|\"C\"E8z16A,2C6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"D4E4E2E4D2E4z12|\"Em\"A4G4G4E2G4E8z2D2C2|\"F\"D16\"G\"z8E2D2D4|\"C\"C8z16A,2C6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"D4E4E2E4D2E4z4D2D6|\"Am\"D4C4E2E4D2E4z4A,2C6|\"F\"D8E8\"G\"D12C4|\"C\"E8z16A,2C6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"D4E4E2E4D2E4z12|\"Em\"A4G4G4E2G4E8z2D2C2|\"F\"D16\"G\"z8E2D2D4|\"C\"C8z24|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"z32|\"C\"z32|\"C\"z32|\r\nV: Ins\r\nZ3|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
