<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=92\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:C\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"C\"z32|\"Em7\"z32|\"Am\"z32|\r\nV: Ins\r\nz16z6G2G4A4|c16z8d4c4|g16z8e4g4|a16z4g4e4c4|\r\nV: Vocal\r\n\"F\"z32|\"C\"z32|\"Em7\"z32|\"F\"z16\"G\"z16|\r\nV: Ins\r\nd16z8G2A2c2d2|e4e2e2e2z2d2d2d2z2c2c2c4A2G2|A4G4G4E2E8z6D2E2|G4E2E6D4D4C4C4D4|\r\nV: Vocal\r\n\"C\"z32|\r\nV: Ins\r\nC32|\r\n% verse\r\nV: Vocal\r\n\"C\"z4G2G2G4E4A4G4E4D4|\"Em7\"D4E8z16z4|\"Am\"z4A2c2c4c4c4A2A6G4|\"Em7\"G4E8z16z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F\"z4A2c2c4c4c4A2A6G4|\"C\"G8\"Em7/B\"A8\"Am\"C8z8|\"Dm7\"z4D2D2D8D4E2G6E4|\"G\"E4D8z16z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F\"z4A2A2A4G2A6c8z4|\"Em7\"z4G2G2G4A4\"Am\"C8z8|\"Dm7\"z4D2C2D4E4D8z4C4|\"G\"A,4C4z12C2C2E4C4-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"C8z24|\"C\"z32|\"C\"z2C2G2E2G4E2A6G8E4|\"Em7\"G8A6E8z8z2|\r\nV: Ins\r\nz8e4g4a4g8e2d2|c32|Z2|\r\nV: Vocal\r\n\"Am\"z4A2c2c4A4c4c4c4A4|\"Em7\"A4G8z16z4|\"F\"z4A2c2c4A2c6c8A4|\"C\"G6G6A4\"Am\"C8z8|\r\nV: Ins\r\nZ|z16z4D2E2G4E2z2|Z2|\r\nV: Vocal\r\n\"Dm7\"D4D2C2D4D4\"G\"D4D2E2D4C2C2-|\"C\"C6z16z6A,2C2|\"F\"D4D8E4D8z8|\"Em\"G4G4E2G6\"Am\"A8z4A2c2|\r\nV: Ins\r\nZ|z12D2E2G4E4D4z4|Z2|\r\nV: Vocal\r\n\"Dm7\"e4d4d4c2d16z2|\"G\"z16z4G2G2A4c2c2-|\"C\"c12-c2z16z2|\"C\"z16z4G4A4c4|\r\nV: Ins\r\nZ2|z16a4g8e2d2|c16z16|\r\n% chorus\r\nV: Vocal\r\n\"C\"e4e4z12e4d4c4|\"Em\"G8z12G4A4c4|\"Am\"e4e4z8e6d6c4|\"Em\"G8z12G4A4c4|\r\nV: Ins\r\nZ|z8a4g2a2g4z12|Z|z8a4g2a2g4z12|\r\nV: Vocal\r\n\"F\"d4d16e4d4c4|\"C\"G8z16E2E6|\"Dm7\"D8z8\"G\"D2E6D4C4|\"C\"C8z24|\r\nV: Ins\r\nZ|z8e4d2e2g8z8|Z2|\r\n% verse\r\nV: Vocal\r\n\"C\"E4E2E2G4G4G2E2G2E2G8|\"Em\"G4G2G2G4G4G2E2G2E2G4z4|\"Am\"A2A4G2A4G2A6A4c4A4|\"Em\"G2E2G2E2G2E2G2E2G4E2A6G4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F\"z4A4A2A4c6c8z4|\"C\"z8G2G4A6C4z6A,2|\"Dm7\"D4D2C2D4D4\"G\"D2E6D2C2D4-|\"C\"D4C8z16z4|\r\nV: Ins\r\nZ3|z12e4g12e2d2|\r\nV: Vocal\r\n\"C\"z32|\"F\"z32|\"Em\"z32|\"Am\"z32|\r\nV: Ins\r\nc32|Z3|\r\nV: Vocal\r\n\"Em\"z32|\"F\"z32|\"Em\"z32|\"Dm7\"z32|\r\nV: Ins\r\nZ|A2z24z6|Z|F4z24z4|\r\nV: Vocal\r\n\"G\"z32|\"C\"G2E2G2E2G4E4G2E2G2E2G8|\"Em\"G4G2E2G4G2E2A4G2G6z2G2|\"Am\"A4A2G2A4A2G2A4A2G2c4A4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G4G2E2G4G4A4G4A4C4|\"F\"D4D4D4C4D2D4C2E4D4|\"Em\"G4E8z16z2A,2|\"Dm7\"D4E4D4C4\"G\"D8E8|\r\nV: Ins\r\nZ2|z12e4g12e2z2|Z|\r\nV: Vocal\r\n\"C\"C8z24|\"C\"z32|\"C\"e2d2e2d2e4d4d4c2c8G2|\"Em\"G2E2G2E2G4G2E2G4G2E2G8|\r\nV: Ins\r\nz8e4g4a4g8e2d2|c32|Z2|\r\nV: Vocal\r\n\"Am\"z4A2c2c4c4c4A4A4G4|\"Em\"A4E8z16z4|\"F\"z4A2c2c4A2G2A4A2c6A4|\"C\"G4G2G2-\"Em7/B\"G2G6\"Am\"G2E2G2E2G4E2D2-|\r\nV: Ins\r\nZ|z16z4D2E2G4E4|Z2|\r\nV: Vocal\r\n\"Dm7\"D4z4D4D4\"G\"D4D4E4D4-|\"G\"D8z12E4E4E4|\"C\"C8z12G4A4c4|\r\nV: Ins\r\nZ3|\r\n% chorus\r\nV: Vocal\r\n\"C\"e4e8z8e4d4c4|\"Em\"G8z12G4A4c4|\"Am\"e4e8z4e6d6c4|\"Em\"G8z12G4A4c4|\r\nV: Ins\r\nZ|z8a4g2a2g4z12|Z|z8a4g2a2g4z12|\r\nV: Vocal\r\n\"F\"d4d16e4d4c4|\"C\"G8z16D2E6|\"Dm7\"D8z8\"G\"D2E6D4C4|\"C\"C8z16E2E6|\r\nV: Ins\r\nZ|z8e4d2e2g8z8|Z2|\r\nV: Vocal\r\n\"Dm7\"D4D2D6z4\"G\"D4E4D2C6|\"C\"C8z16E2E6|\r\nV: Ins\r\nZ2|\r\nV: Vocal\r\nM:9/8\r\n\"Dm7\"D4D8z4\"G\"z16z4|\r\nV: Ins\r\nM:9/8\r\nZ|\r\nV: Vocal\r\nM:4/4\r\n\"G\"z32|\"G\"z32|\r\nV: Ins\r\nM:4/4\r\nZ|z16g8a8|\r\n% outro\r\nV: Vocal\r\n\"C\"z32|\"Em\"z32|\"Am\"z32|\"Em\"z32|\r\nV: Ins\r\nc'16z4d'8c'4|g16z8e4g4|a16z4g4e4c4|d24e4g4|\r\nV: Vocal\r\n\"F\"z32|\"C\"z8\"Em/B\"z8\"Am\"z16|\"Dm7\"z16\"G\"z16|\"C\"z32|\r\nV: Ins\r\na16z4c'8a4|g8e8c16|d12e4d12c4|c32|\r\nV: Vocal\r\n\"C\"z32|\r\nV: Ins\r\nZ|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
