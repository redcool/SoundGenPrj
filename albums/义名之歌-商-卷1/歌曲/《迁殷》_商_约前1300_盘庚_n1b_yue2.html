<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=78\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:G\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ2|\"Em\"z32|\"Bm\"z32|\r\nV: Ins\r\nZ|z24d4e4|g24a4b4|f24d4B4|\r\nV: Vocal\r\n\"Cmaj7\"z16\"D\"z16|\"Em\"z32|\r\nV: Ins\r\ne16d16|B32|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2E2E2E2E2E2E2E2E4D4E4B,4|\"Bm\"D4D4z16z4B,2D2|\"Cmaj7\"E2E4E4z2E2D2\"D\"E4D2D2D2B,2B,2A,2|\"G\"B,4A,4G,2A,4B,4z8z2A,2B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,4z8A,2G,2A,4A,2G,2A,4G,2A,2-|\"Em\"A,2B,6z4A,4B,4z6B,2B,2D2|\"Cmaj7\"E2E4E2E2E2E2D2\"D\"E4D2D2D4z4|\"Em\"B,4B,2A,2B,2A,2B,4E,4E,2G,2G,4E,2E,2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E,4z16z4B4D4|\"Em\"E6E2E2E2E2D2E4E4z4E2D2|\"Bm\"E2F2F2F4F2F2E2F2G4F4z6|\"Cmaj7\"G2G2G2G2G2G2G2G4G2G2G2G4A4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"G\"B6A2B4A2A4G6z8|\"Am\"A2G2A4A4z4A2A2A2A4z2A2B2|\"Em\"B4E2E2E4E4E4E2D2E4D4|\"Em\"G4E8z16z4|\r\nV: Ins\r\nZ3|z16z4B,4D4E4|\r\nV: Vocal\r\n\"Em\"z24z2B,2B,2D2|\"Em\"E4E2D2E4D2E4D4E6E2D2|\"Bm\"F4F2F2F4F2B,2D8z8|\"Cmaj7\"G2G2G4G8G2G2G4G4G2A2|\r\nV: Ins\r\nG16A8B2z6|Z3|\r\nV: Vocal\r\n\"G\"B4B4B4A2B4G6z6G2|\"Am\"A2A2A2G2A8z12D2E2-|\"Em\"E4z16z6B,2B,2D2|\"C\"E4E8E2D2\"D\"D4B,4D2D4E2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E12-E2z8B2B4d4|\r\nV: Ins\r\nZ|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2d4B6B4B4|\"Bm\"A4A2G2A4A2G2A4A2B2B4d4|\"C\"e4z4e2e2e2d2e6e2e2d2d2B2|\"G\"B6B2B4A2G2B8z8|\r\nV: Ins\r\nZ3|z24z4B,2D2|\r\n% interlude\r\nV: Vocal\r\n\"Em\"z32|\"Bm\"z32|\"C\"z16\"D\"z16|\"Em\"z24z4B,2D2|\r\nV: Ins\r\nE16z4G4A4B4|F24D4B,4|E16F8D8|E24-E4z4|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2E2E4E4E2D2E4D4E2D2E2D2|\"Bm\"F4F4F2B,4D6z12|\"C\"G2G2G2G8G2G2G4G6G2A2|\"G\"B2A2B2A2B4A2B6z12|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A4A2G2A4A8z8B4|\"Em\"B6E6D4E8z6D2|\"C\"E2D2E4E8\"D\"F8F4D2F2-|\"Em\"F4E12z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E2E2E2E2E2D2E2D2E6D2E2D2E2D2|\"Bm\"F8z16z4B,2D2|\"C\"E4E2E2E2D2E2D2E6D2E4E2D2|\"G\"B,6A,2B,4A,2B,6z12|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A4A2G2A8A2A4G2A4A2G2|\"Em\"B16z12B,2D2|\"C\"E4E2D2E8\"D\"z6D2D4D2B,2|\"Em\"E16z6B2B4d4|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2d4B6B4B2A2|\"Bm\"A2G2A4A4G2A6z2B2B4d4|\"C\"e4z4e2e2e2d2e8e2d2d2B2|\"G\"B6A4G2A4B8z8|\r\nV: Ins\r\nZ3|z24z4B,2D2|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nE16z4G4A4B4|F16D16|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2E2E2E2E2D2E2D2E2E2E2E2E4E2D2|\"Bm\"B,2D6z16z6B,2|\"C\"E2E2E2D2E4E4D2E4D2E4D4|\"G\"D4B,2B,4A,4z2A,4A,2G,2B,4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,2A,2A,4A,4A,2G,2A,2G,2A,4z4B,2D2|\"Em\"E4D2E4B,6z8D4D2B,2|\"Em\"E32|\"Em\"E2E2E2E2E2D2E2D2E4B,4E2D2E4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Bm\"F8F4F2B,2D8z4B,2D2|\"C\"E4E2E4z4B,2E4E2D2E4E2D2|\"G\"D16z16|\"Am\"A2A4G2A8A2G2A8A2B2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"B4B2B2E2D4E6z8z2B,2|\"C\"E2E2E2D2E4E2D2\"D\"E4F4F4D4|\"Em\"E16z8B4d4|\r\nV: Ins\r\nZ3|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2B2B2d4B4B2A2G2|\"Bm\"A4A2A2A2G4A6z2B2B2B2d4|\"C\"e16\"D\"d8d2d2d2d2|\"Em\"B16z8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2B2B2d4B4B2A2G2|\"Bm\"A4A2A2A2G4A6z2B2B2B2d4|\"C\"e16\"D\"f8d2d2d2d2|\"Em\"e16z8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2B2B2d4B4B2A2G2|\"Bm\"A4A2A2A2G4A6z2B2B2B2d4|\"C\"e16\"D\"d8d2d2d2d2|\"Em\"B16z8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2B2B2d4B4B2A2G2|\"Bm\"A4A2A2A2G4A6z2B2B2B2d4|\"C\"e16\"D\"f8d2d2d2d2|\"Em\"e16z8B,4D4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E4z4B,2B,2B,2B,2B,2D4B,4B,2A,2G,2|\"Bm\"A,4A,2A,2A,2G,4A,4z4B,2B,2B,2D4|\"C\"E16\"D\"D8D2D2D2D2|\"Em\"B,16z8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2B2B2d4B4B2A2G2|\"Bm\"A4A2A2A2G4A6z2B2B2B2d4|\"C\"e16\"D\"f8d2d2d2d2|\"Em\"e16z8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2B2B2d4B4B2A2G2|\"Bm\"A4A2A2A2G4A6z2B2B2B2d4|\"C\"e16\"D\"d8d2d2d2d2|\"Em\"B16z8B,4D4|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"Em\"E4E2D2E2D4E6E4E2D2B,2D2-|\"Bm\"D4B,4z16z4B,2D2|\"C\"E4E2D2E4E4\"D\"E2D4D2D4B,2D2-|\"G\"D2B,6z16z4A,2B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,2A,6z12A,2G,2A,2G,2A,4|\"Em\"B,8z16z4B,2D2|\"C\"E4E2D2E4E2E2\"D\"E4D2D2D4D2B,2|\"Em\"D4B,2D4B,6z8z2B,2B,2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"E8E2E2E2E2\"D\"D8D2E6|\"Em\"B,8z16z6B,2|\r\nV: Ins\r\nZ2|\r\nV: Vocal\r\nM:9/8\r\n\"C\"E4E2D2E4E4\"D\"D4D4D4D4D2B,2|\r\nV: Ins\r\nM:9/8\r\nZ|\r\nV: Vocal\r\nM:4/4\r\n\"D\"D4B,2B,6D12E8-|\"Em\"E16z16|\"Em\"z32|\r\nV: Ins\r\nM:4/4\r\nZ3|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
