<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=82\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:Em\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"Em\"z32|\"Bm\"z32|\"Em\"z32|\r\nV: Ins\r\nZ|z12e2f2g8z4f2e2|d8z4B2A2B16|z12e2f2g8a4b4|\r\nV: Vocal\r\n\"Bm\"z32|\"Am\"z32|\"Em\"z32|\"D\"z32|\r\nV: Ins\r\nf16z8e4d4|e16z4e4g4a4|b12a2g2e12d2e2|f16z4e4d4B4|\r\nV: Vocal\r\n\"Em\"z24z4B,2B,2|\r\nV: Ins\r\ne24-e4z4|\r\n% verse\r\nV: Vocal\r\n\"Em\"E4E2D2E4B,4z8B,2B,2B,2B,2|\"Bm\"D4B,4z16z4B,2D2|\"Em\"E8z6B,2E4E4D4E4|\"Bm\"B,8z16z6B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,8A,4G,2A,6z8z2G,2|\"Em\"E8E2D4E6z6E2E2G2|\"D\"A4A2A6A2G2A4G4F4D4|\"Em\"E8z16z6B,2|\r\nV: Ins\r\nZ3|z12B4A4G4F4D2z2|\r\nV: Vocal\r\n\"Em\"E4E2E6z2B,2E4E4E4B,4|\"Bm\"D8z16z4B,2D2|\"Em\"E4E2E2E4B,4E4E4D4E4|\"Bm\"B,8z16z6B,2|\r\nV: Ins\r\nZ|z12F2G2F8D4z4|Z|z12F2G2F8D6z2|\r\nV: Vocal\r\n\"Am\"A,4A,4A,4G,2A,6A,4A,2D6|\"Em\"B,8z16z6B,2|\"D\"A4A8z8A4G4F4|\"Em\"E8z24|\r\nV: Ins\r\nZ|z12B4A4G4F4E2z2|Z|z12B4A4G4F4D4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\"Bm\"d4d4B6B2d2d2d4B4z4|\"Em\"E2E4G2E6E2B2B2A4B4B,4|\"D\"D8z6D2D2D2D2D2D4B,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E8z16z6B,2|\r\nV: Ins\r\nz12B4A4G4F4D2z2|\r\n% verse\r\nV: Vocal\r\n\"Em\"E4E4E4z2B,2E4E4E4B,4|\"Bm\"D8z16z4B,2D2|\"Em\"E8E4B,2E6E4D4E4|\"Bm\"B,8z16z4B,2B,2|\r\nV: Ins\r\nZ|z12F2G2F8D4z4|Z|z12F2G2F8D4z4|\r\nV: Vocal\r\n\"Am\"A,4A,8z8A,4A,4D4|\"Em\"B,8z16z4B,2B,2|\"D\"D4D2D8z6B,4F8|\"Em\"E8z24|\r\nV: Ins\r\nZ|z12B4A4G4F4z4|Z|z12B4A4G4F4D4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\"Bm\"d4d4B6B2d2d2d4B4z4|\"Em\"E2E4G2E6E2B2B2A4B4B,4|\"D\"D8z6D2D2D2D2D2D4B,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E16z16|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2D2E4E2D2E4E2D2E4G4B,4|\"Bm\"D8z16z6B,2|\"Em\"E2D2E8E2D2E4E4G8|\"Bm\"B,8z16z6B,2|\r\nV: Ins\r\nZ|z12F2G2F8D6z2|Z|z12F2G2F8D6z2|\r\nV: Vocal\r\n\"Am\"A,4A,4A,4A,4z12z2B,2|\"Em\"E4D4E4E8z12|\"Am\"A4A2G2A4A2G2A4G2A6A2G2|\"Em\"B4B4B4B2B2B4B4A4G4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Bm\"D4F8z16z2B,2|\"Am\"A,4A,4A,4A,2G,2A,4A,2G,2A,6B,2|\"D\"D2D2D4D8z4B,2B,2D4B,2E2-|\"Em\"E6z24z2|\r\nV: Ins\r\nz12F2G2F8D6z2|Z2|z12B4A4G4F4D4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\"Bm\"d4d4B6B2d2d2d4B4z4|\"Em\"E2E4G2E6E2B2B2A4B4B,4|\"D\"D8z6D2D2D2D2D2D4B,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E16z16|\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\"Bm\"d4d4B6B2d2d2d4B4z4|\"Em\"E2E4G2E6E2B2B2A4B4B,4|\r\nV: Ins\r\nz16A4G4F4D4|Z3|\r\nV: Vocal\r\n\"D\"D8z6D2D2D2D2D2D4B,4|\"Em\"E16z16|\r\nV: Ins\r\nZ|z16A4G4F4D4|\r\n% interlude\r\nV: Vocal\r\n\"Em\"z32|\"Bm\"z32|\"Em\"z32|\"D\"z32|\r\nV: Ins\r\nE6G2E6E2B2B2A4B4B2d2|d4d4B6B2d2d2d4B8|E6G2E6E2B2B2A4B4B,4|D16z4D4D4B,4|\r\nV: Vocal\r\n\"Em\"z32|\r\nV: Ins\r\nE32|\r\n% chorus\r\nV: Vocal\r\n\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\"Bm\"d4d4B6B2d2d2d4B4z4|\"Em\"E2E4G2E6E2B2B2A4B4B,4|\"D\"D8z6D2D2D2D2D2D4B,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E16z16|\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\"Bm\"d4d4B6B2d2d2d4B4z4|\"Em\"E2E4G2E6E2B2B2A4B4B,4|\r\nV: Ins\r\nz16A4G4F4D4|Z3|\r\nV: Vocal\r\n\"D\"D8z6D2D2D2D2D2D4B,4|\"Em\"E16z16|\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\"Bm\"d4d4B6B2d2d2d4B4z4|\r\nV: Ins\r\nZ|z16A4G4F4D4|Z2|\r\nV: Vocal\r\n\"Em\"E2E4G2E6E2B2B2A4B4B,4|\"D\"D8z6D2D2D2D2D2D4B,4|\"Em\"E16z16|\"Em\"E2E4G2E6E2B2B2A4B4B2d2|\r\nV: Ins\r\nZ2|z16A4G4F4D4|Z|\r\nV: Vocal\r\n\"Bm\"d4d4B6B2d2d2d4B4z4|\"Em\"E2E4G2E6E2B2B2A4B4B,4|\"D\"D8z6D2D2D2D2D2D4B,4|\"Em\"E16z16|\r\nV: Ins\r\nZ3|z16A4G4F4D4|\r\nV: Vocal\r\n\"Em\"z32|\r\nV: Ins\r\nE32|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
