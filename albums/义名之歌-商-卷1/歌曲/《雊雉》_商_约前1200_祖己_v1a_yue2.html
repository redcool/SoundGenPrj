<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=84\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:F\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"Dm\"z32|\"Bbmaj7\"z32|\"C\"z32|\r\nV: Ins\r\nz24z4a2c'2|d'16z4f'4e'4c'4|a16z8d4f4|g16z4a4f4e4|\r\nV: Vocal\r\n\"Dm\"z32|\"Dm\"z32|\"Bbmaj7\"z32|\"C\"z32|\r\nV: Ins\r\nd24A4c4|d8d4f4d8c4A4|G6A2G4F4D8D4F4|G6G2G4A4G6F2D4C4|\r\nV: Vocal\r\n\"Dm\"z32|\r\nV: Ins\r\nD32|\r\n% verse\r\nV: Vocal\r\n\"Dm\"D4A4A4G4A8z8|\"Bbmaj7\"D4A4G4F4D8z8|\"C\"C4D4E4D4C4D4C4A,2G,2|\"F\"A,8z24|\r\nV: Ins\r\nZ3|z16z4c2d2c4A4|\r\nV: Vocal\r\n\"Dm\"D8D4F4D8z8|\"Bbmaj7\"A6G6F4D8z8|\"C\"C4D4E4D4C8A,4C4|\"Dm\"D8z12D4F4G4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"A8z4G4A4d4z8|\"Bbmaj7\"d4c4c4A2G2A8z8|\"C\"G8G4A4G8z8|\"F\"A8A4G4A4D4F4G4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"A8z12A4G4F4|\"Bbmaj7\"G8F4D4D8z8|\"C\"C2C2C2C2C4D2D2E4G4A,4C4|\"Dm\"D4D4D2D2C2C2D4D4z8|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4G4|\"Dm\"A16z16|\r\nV: Ins\r\nZ3|z16z4A2c2d2f2e2c2|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16z4d4f4g4|\r\nV: Vocal\r\n\"Dm\"z32|\r\nV: Ins\r\na32|\r\n% verse\r\nV: Vocal\r\n\"Dm\"D4A4A4G4A8z8|\"Bbmaj7\"D4A4G4F4D8z8|\"C\"C4D2D2E4D4C4C4C4D4|\"F\"C8A,4G,4A,8z4C4|\r\nV: Ins\r\nZ|z24f2e2d2c2|Z2|\r\nV: Vocal\r\n\"Dm\"D8D4F4D8z8|\"Bbmaj7\"A6G6F4D8z8|\"C\"C4D4E8C8A,4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ|z24f2e2d2c2|Z|z16f4g4a4c'4|\r\n% chorus\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4G4|\"Dm\"A16z16|\r\nV: Ins\r\nZ3|z16f4e2c2d2f2e2c2|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16f4e4d4c4|\r\n% verse\r\nV: Vocal\r\n\"Dm\"D8D4F4A4A8D4|\"Bbmaj7\"F8D4C4D8z4C4|\"C\"C4D2D2E4D4C8A,4C4|\"Dm\"D12z16A2c2|\r\nV: Ins\r\nZ3|z12d2e2f4e2e2d4z4|\r\nV: Vocal\r\n\"Dm\"d4d4d4c4d4d2c2d8|\"Bbmaj7\"d6c6A2G2A8z8|\"C\"G4G2G2G4F4G4G4G4F4|\"F\"A4A4A2A2G4A8z4C4|\r\nV: Ins\r\nZ|z24f2e2d2c2|Z2|\r\nV: Vocal\r\n\"Dm\"D8D4F4D8z8|\"Bbmaj7\"A6G6F4D8D4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|\r\n% chorus\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4G4|\"Dm\"A16z16|\r\nV: Ins\r\nZ3|z16f4e2c2d2f2e2c2|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16f4e2e2d4c4|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4G4|\"Dm\"A16z16|\r\nV: Ins\r\nZ3|z16f4e2c2d2f2e2c2|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16f4e2e2d4c4|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4G4|\"Dm\"A16z16|\r\nV: Ins\r\nZ3|z16f4e2c2d2f2e2c2|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16f4e2e2d4c4|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4G4|\"Dm\"A16z16|\r\nV: Ins\r\nZ3|z16f4e2c2d2f2e2c2|\r\nV: Vocal\r\n\"Dm\"d2d2d2d2d4c2c2d4f4d4c4|\"Bbmaj7\"A4A2A2A4G4A8z8|\"C\"G8G4A4c8A4C4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16f4e2e2d4c4|\r\nV: Vocal\r\n\"Dm\"z32|\r\nV: Ins\r\nd32|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
