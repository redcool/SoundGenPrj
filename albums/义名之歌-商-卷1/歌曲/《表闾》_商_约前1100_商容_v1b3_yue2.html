<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=93\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:Eb\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ2|\"Eb\"z32|\"Bb/D\"z32|\r\nV: Ins\r\nZ|z24e'4f'4|g'16z4b'4c''4b'4|f'24e'4f'4|\r\nV: Vocal\r\n\"Cm\"z32|\"Gm7\"z32|\"Abmaj7\"z32|\"Gm7\"z16\"Cm\"z16|\r\nV: Ins\r\ng'16z4b'4c''4b'4|f'16z8e4f4|g8c'8d'8e'8|f'8b8g12z4|\r\nV: Vocal\r\n\"Fm7\"z16\"Bb\"z16|\"Eb\"z32|\r\nV: Ins\r\nf4g4f4e4c8B8|e32|\r\n% verse\r\nV: Vocal\r\n\"Eb\"E4E4B4G8z4F4E4|\"Bb/D\"D4D4B4G8z12|\"Cm\"E4E4c4c8z4B4G4|\"Gm7\"F4G4B4G8z8B,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Ab\"C4E8E8z4F4E4|\"Gm7\"B4B4B2c6\"Cm7\"G8z8|\"Fm7\"F4G2F6E2E2E4C4G6F2-|\"Bb7sus4\"F6z8z2\"Bb\"z12B,2C2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Ab\"E4E4E4c12c4e4|\"Gm7\"d6B6G4-\"Cm7\"G4G4F4E4|\"Fm7\"G6F6E4C6E6z4|\"Bb7sus4\"z16\"Bb\"C4E4F6E2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Eb\"E12-E2z16z2|\"Eb\"z24z2B,2E2C2|\"Eb\"E4E4B4G8F2G2F4E4|\"Bb/D\"D4D4B4G8F2G2F2G2F2E2|\r\nV: Ins\r\nz16c8f8|e16-e4B2c2e2z6|Z2|\r\nV: Vocal\r\n\"Cm7\"E4E4c4c8c2B2c2B2c4|\"Gm7\"G8z16z4B,4|\"Ab\"C4E4E4E8z4F4E4|\"Gm7\"B8B2c6\"Cm7\"G8z4F2G2|\r\nV: Ins\r\nZ|z8B4c4d8e4z4|Z2|\r\nV: Vocal\r\n\"Fm7\"F2E2F2E2F4F2E2F4G4F2G2F2E2|\"Bb7sus4\"F2E2F4F4F2E2\"Bb\"F2G2B12-|\"Bb\"B16-B4z12|\r\nV: Ins\r\nZ3|\r\n% chorus\r\nV: Vocal\r\n\"Eb\"B4g4f4g4B8z8|\"Bb/D\"f8f4g4\"Gm7\"B8z8|\"Cm\"c4g4f4g4c8z8|\"Bb\"d8d4e4\"Eb\"G8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Ab\"c4g4f4g4c8z8|\"Gm7\"b8b4c'4\"Cm\"g8f2g6|\"Fm7\"c16z16|\"Bbsus4\"z12B4c4e4f6e2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Eb\"e16-e6z8z2|\"Eb\"z24z2E2E2E2|\r\nV: Ins\r\nz16z6f2g2f2e2c2|e24z8|\r\n% verse\r\nV: Vocal\r\n\"Eb\"B4G4G2F2G2F2G8F4F2E2|\"Bb/D\"B4G4G2F2G2F2G8G4F2E2-|\"Cm7\"E2z2G4F4E4z4B,4B4G4-|\"Gm\"G8z16z4F2E2|\r\nV: Ins\r\nZ3|z8B4c4d8e4z4|\r\nV: Vocal\r\n\"Ab\"F2E2F2E2F2E2F2E2F4G8F2E2|\"Gm7\"F4G4B4B2G2\"Cm7\"B4G6G2G4|\"Fm7\"A2G2F4F4F2E2C4E4G6F2-|\"Bbsus4\"F16-F6z8z2|\r\nV: Ins\r\nZ3|z16z6f2g2f2e2c2|\r\nV: Vocal\r\n\"Bbsus4\"z16z4B,4C4E4|\"Eb\"z4E4E4E2E2E2E2E2E2E4B,4|\"Bb/D\"D4D2D2D4D2D4D2D4D4B,4|\"Cm7\"E4C4E4C2C2E4C2C6E4|\r\nV: Ins\r\nB16z16|Z3|\r\nV: Vocal\r\n\"Gm7\"F4G4F4G2B6G2G6F4|\"Abmaj7\"F4G4c4c8z8e4|\"Gm7\"d8B2c6\"Cm\"G8F4G4|\"Fm7\"A2G2F4F8z12B,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Bb\"B4G4B4G2B6B12-|\"Bb\"B32|\"Eb\"e2e2e2c2e4c4e2e2e2c2e4z4|\"Bb/D\"d4d2d2d4d2d2d4c2d6d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Cm\"e4e2c2e4c2c2e4e2c2e4c4|\"Gm\"d4d2d2d4d4d4d4d4B4|\"Ab\"c4c4c4c2B2c2c2c4c4B4|\"Gm7\"B6G8z12z2G4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fm7\"A4G4F4E4\"Bb\"E6F6E4-|\"Eb\"E16-E4z12|\"Eb\"B2B2B2B2B2B2B2B2B4G4G4F2E2|\"Bb/D\"F4F2E2F4F2G2B,4G8F4|\r\nV: Ins\r\nZ|z16z4e2f2g2f2e2c2|Z2|\r\nV: Vocal\r\n\"Cm7\"F4G4G4G2F2G2F2G4G4F2E2|\"Gm7\"F4F2E2F4G4B4G8F2E2|\"Abmaj7\"F4G8F2E2F4G12|\"Gm7\"B8c8\"Cm7\"G8G4F4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fm7\"G4F4G4F16z4|\"Bb\"z12B,4C6F6E4-|\"Eb\"E24-E4z4|\r\nV: Ins\r\nZ3|\r\n% chorus\r\nV: Vocal\r\n\"Eb\"B4g4f4g4B8z8|\"Bb/D\"f8f4g4\"Gm7\"B8z8|\"Cm\"c4g4f4g4c8z8|\"Bb\"d8d4e4\"Eb\"G8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Abmaj7\"c4g4f4g4c8z8|\"Gm7\"b8b4c'4\"Cm\"g8g2g6|\"Fm7\"c16z16|\"Bb\"z12B4c4e4f6e2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Eb\"e16-e6z2G2G6|\"Ab\"C8C4G8F4F4E4|\"Gm7\"B8c8\"Cm7\"G8G2G6|\r\nV: Ins\r\nZ3|\r\nV: Vocal\r\nM:9/8\r\n\"Fm7\"G4F16z16|\r\nV: Ins\r\nM:9/8\r\nZ|\r\nV: Vocal\r\nM:3/8\r\n\"Fm7\"z12|\r\nV: Ins\r\nM:3/8\r\nZ|\r\nV: Vocal\r\nM:4/4\r\n\"Fm7\"B,4C4E4F4E16|\r\nV: Ins\r\nM:4/4\r\nZ|\r\n% outro\r\nV: Vocal\r\n\"Eb\"z32|\"Eb\"z32|\"Eb\"z32|\"Eb\"z32|\r\nV: Ins\r\ne'32|z16c'8b8|g32|Z|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
