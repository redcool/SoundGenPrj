<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/16\r\nQ:1/4=100\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:C\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"C\"z16|\"Em\"z16|\"Am\"z16|\r\nV: Ins\r\nZ|e4z2d2e4g4|d8z2g2a2g2|c4z2B2c4g4|\r\nV: Vocal\r\n\"Em\"z16|\"Fmaj7\"z16|\"Em7\"z8\"Am\"z8|\"Dm7\"z8\"G\"z8|\r\nV: Ins\r\nB8z2G2A2c2|d2e2d2c2A4z2GA|d2e2d2c2G4z2GA|c2A2c2A2e4d4|\r\nV: Vocal\r\n\"C\"z16|\r\nV: Ins\r\nc16|\r\n% verse\r\nV: Vocal\r\n\"C\"EDEDE2EDEDEDE2G2|\"Em7\"G4D2D4E2z4|\"Am\"CB,CB,C2z4C2D2C2|\"Em7\"E4z12|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"AGAGA2z4C2D2C2|\"Em\"E4z8z2A,C|\"Dm7\"DCDCD2zCDDDCDCE2|\"G\"D2C2D4z6CD|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"EDEDEDEDE2G4D2|\"C\"D2C4z6zCCD|\"C\"EE2DEDEDEDEDEE2D|\"Em7\"DCDCDCDCDD2CE2z2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,2C2z6C2D2C2|\"Em7\"E4z8z2GG|\"Fmaj7\"A2AA2AAGAGAGA2C2|\"Em7\"DCDCD2DC\"Am7\"D2EDE2EE|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm7\"D2z4E2\"G\"DDDED2C2-|\"C\"C2z12z2|\r\nV: Ins\r\nZ|z8z2GAcdeg|\r\n% pre-chorus\r\nV: Vocal\r\n\"Fmaj7\"A2A2A2GA3G2A2c2|\"Em7\"B4B2AB3c4G2|\"Dm7\"A2c4z4cAc2A2|\"G\"e2d2d4z6GG|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"AGAGAAAGA2c2c2cc|\"Em7\"B2G2G2EG3z4AG|\"Dm7\"A2AGAGAGA2AGAGAG|\"G\"AGAGAGAGA2c4cc|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"e2c2z2A2c2A2c2A2|\"G\"e2d4c2d4z4|\r\nV: Ins\r\nZ2|\r\n% chorus\r\nV: Vocal\r\n\"C\"e2z2e2z2e2dededc|\"Em7\"d2z2d2z2dcdcdedc|\"Am\"c2z2c2z2cAcAcAcA|\"Em7\"e6g4e2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A4c4d4z4|\"Em7\"G2G2G2E2\"Am\"c4z4|\"Dm7\"z16|\"G\"z16|\r\nV: Ins\r\nZ2|z2GAcdega8|g16|\r\n% verse\r\nV: Vocal\r\n\"C\"EDEDEDE2z2C2D2C2|\"Em7\"DCDCD2DCD2E2C2z2|\"Am\"DCDCD2DCDCE2E3C|\"Em7\"DCD2DDDED2C2z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A,2C2C2A,2E4D2C2|\"Em7\"D2E4z8A,C|\"Dm7\"D2C2D2E2-\"G\"E4D2C2|\"C\"D2CCz8z2ED|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"EDEDE2EDEDEDEDED|\"Em7\"E2EDEDEDE4zDED|\"Am\"EDCE3EDE2EDEDED|\"Em7\"EEE2EEDE3G2E2z2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A2A2A2AGA2c3ccc|\"Em7\"B2B2G2GEG2GEG2GG|\"Dm7\"A2AGA4z2AGA2G2|\"G\"d12z4|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"C\"e2z2e2z2e2dededc|\"Em7\"d2z2d2z2dcdcdedc|\"Am\"c2z2c2zAcAcAcAcA|\"Em7\"e6g4e2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A4c4d4z4|\"Em7\"G2G2G2E2\"Am\"c4z4|\"Dm7\"z16|\"G\"z16|\r\nV: Ins\r\nZ|z12cdeg|a8z2g2e2c2|d16|\r\nV: Vocal\r\n\"C\"e2z2e2z2e2dededc|\"Em7\"d2z2d2z2dcdcdedc|\"Am\"c2z2c2zAcAcAcAcA|\"Em7\"e6g4e2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A4c4d4z4|\"Em7\"G2G2G2E2\"Am\"c4z4|\"Dm7\"z8\"G\"z8|\"C\"z16|\r\nV: Ins\r\nZ|z12cdeg|a8g8|e16|\r\n% verse\r\nV: Vocal\r\n\"C\"EDEDE2EDEDEDEDED|\"Em7\"EDEDEDEDE2z4ED|\"Am\"EDE2EDEDEDEDEDED|\"Em7\"EDE2EDEDEDEDEDED|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"C2z4A,A,C2C2C2A,2|\"Em7\"G4G2A2\"Am\"E2z3A,A,A,|\"Dm7\"ED2CED2CEDDCE2DC|\"G\"D8z8|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"C\"e2z2e2z2e2dededc|\"Em7\"d2z2d2z2dcdcdedc|\"Am\"c2z2c2zAcAcAcAcA|\"Em7\"e6g4e2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A4c4d4z4|\"Em7\"G2G2G2E2\"Am\"c4z4|\"Dm7\"z16|\"G\"z16|\r\nV: Ins\r\nZ|z12cdeg|a8z2g2e2c2|d16|\r\nV: Vocal\r\n\"C\"e2z2e2z2e2dededc|\"Em7\"d2z2d2z2dcdcdedc|\"Am\"c2z2c2zAcAcAcAcA|\"Em7\"e6g4e2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A4c4d4z4|\"Em7\"G2G2G2E2\"Am\"c4z4|\"Dm7\"z8\"G\"z8|\"C\"z16|\r\nV: Ins\r\nZ|z12cdeg|a8g8|e16|\r\nV: Vocal\r\n\"C\"e2z2e2z2e2dededc|\"Em7\"d2z2d2z2dcdcdedc|\"Am\"c2z2c2zAcAcAcAcA|\"Em7\"e6g4e2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A4c4d4z4|\"Em7\"G2G2G2E2\"Am\"c4z4|\"Dm7\"z8\"G\"z8|\"C\"z16|\r\nV: Ins\r\nZ|z12cdeg|a8g8|c16|\r\nV: Vocal\r\n\"C\"e2z2e2z2e2dededc|\"Em7\"d2z2d2z2dcdcdedc|\"Am\"c2z2c2zAcAcAcAcA|\"Em7\"e6g4e2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Fmaj7\"A4c4d4z4|\"Em7\"G2G2G2E2\"Am\"c4z4|\"Dm7\"z8\"G\"z8|\"C\"z16|\r\nV: Ins\r\nZ|z12cdeg|a8g8|c16|\r\n% outro\r\nV: Vocal\r\n\"C\"z16|\"Em7\"z16|\"Am\"z16|\"Em7\"z16|\r\nV: Ins\r\nZ|Bz12z3|c4z12|B4z12|\r\nV: Vocal\r\n\"Fmaj7\"z16|\"Em7\"z8\"Am\"z8|\"Dm7\"z8\"G\"z8|\"C\"z16|\r\nV: Ins\r\nA4z12|B4z4c4z4|Z2|\r\nV: Vocal\r\n\"C\"z16|\"C\"z16|\"C\"z16|\r\nV: Ins\r\nZ3|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
