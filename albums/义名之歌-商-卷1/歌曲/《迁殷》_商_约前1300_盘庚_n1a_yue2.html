<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>

<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }

  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>

  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>

"D\"f4f2e4d4d2|\"Bm\"d4B8e4\"Em\"B8z8|\"Am\"A8A4G4\"Bm\"B4D8E4|\"Em\"E16z12z2B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E2D2E2D2E2D2E2G2\"D\"A4A4A2G2A2G2|\"G\"B8z8\"Em\"z16|\"C\"E2E2E2D2E4B2B2\"D\"A2G4A6A2G2|\"G\"A2G2A4A2G2B4\"Em\"E4z12|\r\nV: Ins\r\nZ|z16z4d'2e'2g'4f'4|Z|z16z4d'2e'2g'4f'4|\r\nV: Vocal\r\n\"C\"e2e2d2e4e2e2d2\"D\"f4f2e4d2d2B2|\"Bm\"d2d2B2d8d2\"Em\"d2d2B2e8z2|\"Am\"A16\"Bm\"B8d8|\"Em\"e24B2B2d4|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4z4B2B2B2d2\"C\"e4z4e2e4d2|\"D\"d2B2d4d4A2B2\"G\"B8B2A2G4|\"Am\"A4z4A2A2A2G2\"Bm\"B8B4A2G2|\"D\"A8A2G2E2D2\"Em\"E16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"z32|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Em\"E,2E,2E,2D,2E,2E,2E,2D,2\"D\"A,2A,2A,2G,2A,4A,2G,2|\"G\"A,2B,6z8\"Em\"z12z2B,2|\"C\"E2D2E2D2E4B4\"D\"A4A2G2A4A4|\"G\"A2G2A2G2A4G2B2-\"Em\"B6z8z2|\r\nV: Ins\r\nZ|z16z4d'2e'2g'4f'2z2|Z2|\r\nV: Vocal\r\n\"C\"e2d2e4e4e2d2\"D\"e2d2f4d8|\"Bm\"d2d2d2d2d4B4\"Em\"B4A2G2E4z4|\"Am\"A2A2A2A6A2G2\"Bm\"A2G2B4D4z4|\"Bm\"A2A2G2A6A2G2\"Em\"D4E8z4|\r\nV: Ins\r\nZ3|z24z4e'4|\r\nV: Vocal\r\nM:2/4\r\n\"Em\"z12E,2D,2|\r\nV: Ins\r\nM:2/4\r\ng'4f'4e'4z4|\r\nV: Vocal\r\nM:4/4\r\n\"Em\"E,2E,2E,2E,2E,2E,2B,2A,2-\"D\"A,2G,4A,6A,2G,2|\"G\"A,4A,4A,2G,4B,2-\"Em\"B,4z8B,2D2|\"C\"E2E2D2E4D2E2D2\"D\"E2E2D2F4D6|\"Bm\"D2B,2D2B,2D4D4\"Em\"E8B4d4|\r\nV: Ins\r\nM:4/4\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4z4B2B2d4\"C\"e2e2e4e4e2d2|\"D\"d2d2d4d2B2A2B2\"G\"B8B2A2G2A2|\"Am\"A4z4A2A2A2G2\"Bm\"B8B2A2G2A2|\"D\"A4A2G2A2G2E2D2\"Em\"E8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2d4\"C\"e2e2e4e4e2d2|\"D\"d2d2d4d2B2A2B2\"G\"B8B2A2G2A2|\"Am\"A4z4A2A2A2G2\"Bm\"B8B2A2G2A2|\"D\"A4A2G2A2G2E2D2\"Em\"E16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"z32|\r\nV: Ins\r\ne16z4b4a4g4|\r\n% interlude\r\nV: Vocal\r\n\"C\"z32|\"D\"z32|\"Em\"z32|\"Em\"z24B4d4|\r\nV: Ins\r\ne16z4d'4b4a2g2|a16z4b2a2g4f4|e32|Z|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4z4B2B2d4\"C\"e2e2e4e4e2d2|\"D\"d2d2d4d2B2A2B2\"G\"B8B2A2G2A2|\"Am\"A4z4A2A2A2G2\"Bm\"B8B2A2G2A2|\"D\"A4A2G2A2G2E2D2\"Em\"E8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2d4\"C\"e2e2e4e4e2d2|\"D\"d2d2d4d2B2A2B2\"G\"B8B2A2G2A2|\"Am\"A4z4A2A2A2G2\"Bm\"B8B2A2G2A2|\"D\"A4A2G2A2G2E2D2\"Em\"E8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2d4\"C\"e2e2e4e4e2d2|\"D\"d2d2d4d2B2A2B2\"G\"B8B2A2G2A2|\"Am\"A4z4A2A2A2G2\"Bm\"B8B2A2G2A2|\"D\"A4A2G2A2G2E2D2\"Em\"E8B4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4z4B2B2d4\"C\"e2e2e4e4e2d2|\"D\"d2d2d4d2B2A2B2\"G\"B8B2A2G2A2|\"Am\"A4z4A2A2A2G2\"Bm\"B8B2A2G2A2|\"D\"A4A2G2A2G2E2D2\"Em\"E8z8|\r\nV: Ins\r\nZ3|z24B4d4|\r\n% outro\r\nV: Vocal\r\n\"Em\"z16\"C\"z16|\"D\"z16\"G\"z16|\"Am\"z16\"Bm\"z16|\"D\"z16\"Em\"z16|\r\nV: Ins\r\ne8B4d4e8e8|d8d4A4B8B2A2G4|A8A4G4B8B2A2G4|A8A2G2E2D2E8B4d4|\r\nV: Vocal\r\n\"Em\"z16\"C\"z16|\"D\"z16\"G\"z16|\"Am\"z16\"Bm\"z16|\"D\"z16\"Em\"z16|\r\nV: Ins\r\ne8B4d4e8e8|d8d4A4B8B2A2G4|A8A4G4B8B2A2G4|A8A2G2E2D2E16-|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nE16z16|Z3|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ3|\r\nV: Vocal\r\nM:1/4\r\n\"Em\"z8|\r\nV: Ins\r\nM:1/4\r\nZ|\r\nV: Vocal\r\nM:4/4\r\n\"Em\"z32|\"Em\"z32|\"C\"z32|\"D\"z32|\r\nV: Ins\r\nM:4/4\r\nZ|e'24g'4f'4|e'24d'4e'4|a16z4b2a2g4f4|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\ne32|Z|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
