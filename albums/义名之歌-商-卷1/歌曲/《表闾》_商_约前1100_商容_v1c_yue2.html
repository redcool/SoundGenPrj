<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=110\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:Em\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ|E,4E2z2D2E2z2G2z2E2z4D2E2G,4|E,4E2z2D2E2z4B2z2A2z2G2A6|E,4E2z2D2E2z2G2z2E2z4D2E2G,4|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"C\"z32|\r\nV: Ins\r\nE,4E2z2D2E2z16z4|e16e16|e2d4B2^A2=A4G2E16|D2E2G2A2^A2B2d2B2A2=A2G2E2A2G2E2D2|\r\nV: Vocal\r\n\"D\"z32|\"Em\"z32|\"Em\"z32|\"C\"z32|\r\nV: Ins\r\nG2E2D2B,2^A,2=A,2G,2E,16z2|E,4E4D4E4G4E4D4E4|E,4E4D4E4B4A4G2A6|C4E4D4E4G4E4D4E4|\r\nV: Vocal\r\n\"D\"z32|\r\nV: Ins\r\nD,2E,2G,2A,2^A,2B,2D2E2G2=A2^A2B2d2e6|\r\n% verse\r\nV: Vocal\r\n\"Em\"B8B8A4G8A4-|\"Em\"A4G4A4B4A4G8z4|\"C\"A4A4A4G4A4G4A4G4|\"D\"B6E8z16z2|\r\nV: Ins\r\nZ3|z16z4D2E2G2E6|\r\nV: Vocal\r\n\"Em\"B8B8A4G8A4-|\"Em\"A4G4A4B2B2A4G8z4|\"C\"z4A4A4G4A4G4A4G4|\"D\"B6E8z16z2|\r\nV: Ins\r\nZ3|z16z4D2E2G2E6|\r\nV: Vocal\r\n\"C\"E8F8G4A8B4-|\"D\"B4d12e4d4B4d4|\"Em\"B4B16z12|\"Em\"z16z4B4A4G4|\r\nV: Ins\r\nZ2|z16z4E2z2D2E6|z4E2z2D2E2z2G2z16|\r\nV: Vocal\r\n\"C\"A6E8z8z2B4A4-|\"D\"A4B8z8D4D4G4|\"Em\"E4E12z16|\"Em\"z24d2e2e2d2|\r\nV: Ins\r\nZ3|d2e2e2e2e2e2d2e2e2e2e2e2z8|\r\nV: Vocal\r\n\"Em\"e4e4e4d4e4d2e6d2d2|\"Em\"e4d4e4d4g4g4e4z4|\"C\"e2e2e2d2e4d4e4d4B4A4|\"D\"B16z8B4d4|\r\nV: Ins\r\nZ3|z16g2a2^a2b2z8|\r\nV: Vocal\r\n\"Em\"e4e4e8z8B4d4|\"Em\"e4e4d4e8z4B2B2d4|\"C\"e4e4e8e4d4B4A4|\"D\"B16z16|\r\nV: Ins\r\nZ3|z16g2a2^a2b2d'2e'6|\r\nV: Vocal\r\n\"Am\"A8A8A8B8|\"D\"A4G4A8A4A2G2A4G4|\"Em\"E16z16|\"Em\"z16z4e4g4e4|\r\nV: Ins\r\nZ3|e2e2e2e2e2e2e2e2e2z12z2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"g4e8z4d4d4d4e4-|\"C\"e8z12e4g4e4|\"D\"g4e8z4d4d4d4e4-|\"Em\"e8z12e4g4e4|\r\nV: Ins\r\nZ3|z8d2e2z2g2z2a2z12|\r\nV: Vocal\r\n\"Em\"g4e8z4d4d4d4e4-|\"C\"e12g12g4g4|\"D\"f8z12d4d4B4|\"Em\"g6e16z8z2|\r\nV: Ins\r\nZ4|\r\n% interlude\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nE,2E,2E,2E,2G,2E,2E,2A,2E,2E,2^A,2E,2B,4D4|E,2E,2E,2E,2G,2E,2E,2A,2E,2E,2^A,4=A,4G,4|E,2E,2E,2E,2G,2E,2E,2A,2E,2E,2^A,2E,2B,4D4|e32|\r\n% verse\r\nV: Vocal\r\n\"Em\"e4e2d2e4d4e4d4B4A4|\"Em\"B16z16|\"C\"e4e2d2e4d4e4d4B4A4|\"D\"B16z16|\r\nV: Ins\r\nZ|z16g2a2^a2b2d'2e'6|Z|z16g2a2^a2b2d'2e'6|\r\nV: Vocal\r\n\"Em\"e4e4e8e4d4e8|\"Em\"z4d4g4e8z4e4d4|\"C\"e4d4e4d4e4d8z4|\"D\"B4A4B4B8z8E4|\r\nV: Ins\r\nZ3|z16z4^a2b2d'2e'2z4|\r\nV: Vocal\r\n\"C\"G6A6B4A8z8|\"D\"A6A6B4A8z4G4|\"Am\"A6A6G4A6A6z4|\"Am\"a8g8f8d4g4-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"g4e24-e4-|\"Em\"e16-e4z8e2e2|\"Em\"e4z2d2e2d2e2d2e2d2e4e4B4|\"Em\"z2d2e2d2e2d2e2d2g4g4e4e2d2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C\"e4e4e8g4g4e6d2|\"D\"d4d4d4B4d4B4B6B2|\"Em\"e4e4g4e8z8d4|\"Em\"e4d4g4e12e4d4|\r\nV: Ins\r\nZ2|z16z4e2e2g2e2z4|Z|\r\nV: Vocal\r\n\"C\"e6e6d4e8z4g4|\"D\"a8g8f8d4g4|\"Em\"e4e24-e4-|\"Em\"e16-e4z12|\r\nV: Ins\r\nZ3|z16z4e2e2e2e2e2z2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e2d2e2d2e4d4e2d2e2d2e8|\"C\"e4e2d2e4e2d2g4g4e6d2|\"D\"e4e2d2e4d2d2e4e2d2g4e4|\"Em\"e4e2d2g4g4g4g4g4e4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"z8b8a8a4g4|\"C\"a4a4a4b4e16|\"D\"z8b8a12g4|\"Em\"a4a4a4g4a8b8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e32-|\"Em\"e16z16|\r\nV: Ins\r\nZ2|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2D2E2D2E4D4E2D2E4z4D4|\"C\"E2D2E2D2E2D2E4G4G4G4E4|\"D\"E2D2E4E4E2D2E2D2G4E8|\"Em\"E2D2E2D2E8G4G4G4E4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"z8B8A4B4A8|\"C\"A4G4A4B4A4G4E8|\"D\"A8A8A4B4A4B4-|\"Em\"B12z8d4d4g4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e32-|\"Em\"e16z4e4g4e4|\r\nV: Ins\r\nZ2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"g4e8z4d4d4d4e4-|\"C\"e8z12e4g4e4|\"D\"g4e8z4d4d4d4e4-|\"Em\"e8z12e4g4e4|\r\nV: Ins\r\nZ3|z8d2e2z2g2z2a2z12|\r\nV: Vocal\r\n\"Em\"g4e8z4d4d4d4e4-|\"C\"e12g12g4g4|\"D\"f8z12d4d4B4|\"Em\"g6e16z2g4g4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"f8d4e12g4g4|\"C\"f8d4e12g4f4-|\"D\"f8z16d4e4-|\"Em\"e16-e4z12|\r\nV: Ins\r\nZ3|z16z4^a2b2d'2e'6|\r\nV: Vocal\r\n\"Em\"g8g8z16|\"Em\"z16z4d4d4B4|\r\nV: Ins\r\nZ2|\r\n% outro\r\nV: Vocal\r\n\"Em\"e32-|\"C\"e32-|\"D\"e32|\"Em\"z32|\r\nV: Ins\r\nZ3|E4e2z2d2e2z2g2z2a2^a2b2d'2e'6|\r\nV: Vocal\r\n\"Em\"z32|\"C\"z32|\"D\"z32|\"Em\"z32|\r\nV: Ins\r\nE4e4d4e4g4e4d4e4|E4e4d4e4b4a4g2a6|E4e4d4e4g4e4d4e4|D,2E,2G,2A,2^A,2B,2D2E2G2=A2^A2B2d2e6|\r\nV: Vocal\r\n\"Em\"z32|\r\nV: Ins\r\nZ|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
