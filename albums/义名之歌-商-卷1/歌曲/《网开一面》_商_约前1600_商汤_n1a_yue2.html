<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=85\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:Dm\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"Dm\"z32|\"Bb\"z32|\"C\"z32|\r\nV: Ins\r\nZ|d4a4g4a4d12c4|d16z4c4d4f4|g12a4e8d4c4|\r\nV: Vocal\r\n\"Dm\"z32|\r\nV: Ins\r\nd32|\r\n% verse\r\nV: Vocal\r\n\"Dm\"D4D2D2D4C2D2D4z12|\"Bb\"F2F2F2F2F2D2D2C2D4F4D4z4|\"C\"G2G2G2G2G4G2F2G4G2F2A4D4|\"Dm\"z32|\r\nV: Ins\r\nZ3|z8d4f4g4a4f4e4|\r\nV: Vocal\r\n\"Dm\"D2D2D2C2D6C2D4F4D4z2D2|\"Bb\"F2F2F2F2F2D2D2C2D4F4z4D2D2|\"C\"G4G8G2F2G4G2A2D4z4|\"Dm\"D6C2F4D4z16|\r\nV: Ins\r\nZ3|z16z4A,2C2D2F2G2A2|\r\nV: Vocal\r\n\"Dm\"D2D2D2C2D4z2A,2D2C2D2C2F4D4|\"Bb\"F4F2F2F4D4D2C2D2C2F4D4|\"C\"G4G2F2G4A4G4z4G2F2G2F2|\"Dm\"A4A2G2A4c4d8A8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"A2G2A2G2A4A2G2A4d8d2c2|\"Bb\"d4d8d2c2d4f4d6c2|\"C\"d4c2A4z2G2F2G6F2G2A2D4|\"Dm\"F8F4D8z12|\r\nV: Ins\r\nZ3|z16z4A,2C2D2F2G2A2|\r\nV: Vocal\r\n\"Dm\"D2D2D4D4D2C2D4D2F2D4z2A,2|\"Bb\"F2F2F4F2F2F2D2F2D2F2D2F4D2D2|\"C\"G2G2G2F2G4G4G4G2F2G2A2D2C2|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16d4c4A4G4|\r\nV: Vocal\r\n\"Dm\"A4A4A6G2A4A4A4D2D2|\"Bb\"F4F2D2F4F4F2D2F4D6D2|\"C\"G4G2F2G4G8z8G2F2|\"Dm\"A4A4A4c4d8A8|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Dm\"d4a4g4a4d4a4g4a4|\"Bb\"d4a4g4a2a2d2c2f4d8|\"C\"d4g4f4g4d4g4f4g2d2|\"Dm\"f4f2d2f2d2c2d2d6c2f4d4-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"d16-d4z8z2D2|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Dm\"D4D4D2C2D2C2D4F4D4z4|\"Bb\"F2F2F4F4F2D2F4G4F4D2D2|\"C\"G2G2G4G2G2G2F2G4G2F2G4A4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16d'4c'4a4g4|\r\nV: Vocal\r\n\"Dm\"A2A2A4A4A2G2A2A2A4d6d2|\"Bb\"d2c2d6c2d2c2d2c2f4d8|\"C\"d2c2d4d4d2c2d4d2c2d4f4|\"Dm\"d16z16|\r\nV: Ins\r\nZ3|z16d'4c'4a4g4|\r\nV: Vocal\r\n\"Dm\"A2A2A4A4A2G2A4A2G2A4D4|\"Bb\"F2D2F4F4F2D2F2D2F4D4D2D2|\"C\"G2G2G2G2G2F2G4G4G2F2G2A2D4|\"Dm\"D8z16z4A,2C2|\r\nV: Ins\r\nZ3|z8d4f4g4a4f4z4|\r\nV: Vocal\r\n\"Dm\"D4D8D2C2D2C2D2C2D4z4|\"Bb\"D4F4D16z4D2F2|\"C\"G4G4G4G16z4|\"C\"z12C4A,4A,4A,4C4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"D32|\r\nV: Ins\r\nZ|\r\n% chorus\r\nV: Vocal\r\n\"Dm\"d2d2a4d6d2d2d2a4d8|\"Bb\"f2f2f4f8f2f2f4d8|\"C\"d2c2c2c2d4d2c2d4d4f4f4|\"Dm\"d16z16|\r\nV: Ins\r\nZ3|z16d'4c'4a4g4|\r\nV: Vocal\r\n\"Dm\"d2d2a4d6d2d2d2a4d8|\"Bb\"f4f4f2d2f4f4f4f8|\"C\"d4g4f4g4d4g4f4g2d2|\"Dm\"f2d2f4f2d2f4f2d2f2f2d8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"d4a4g4a4d4a4g4a4|\"Bb\"f4f2d2f4f2d2f4f2d2f8|\"C\"d4g4f4g4d4g4f4g4|\"Dm\"f4f2d2f4f2d2f4f2f2d8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"D2D2D2C2D6C2D2C2D4z8|\"Bb\"F2F2F4F2D2F4F2D2F4D4D2D2|\"C\"G4G2F2G4G2F2G4G2F2G2A2D4|\"Dm\"D16z16|\r\nV: Ins\r\nZ3|z16d'4c'4a4g4|\r\nV: Vocal\r\n\"Dm\"A2A2A4A4A2G2A4A2G2A4D2F2-|\"Bb\"F4F2D2F4F2D2F4F2D2F4F4|\"C\"G2G2G4G16z8|\"C\"z16z6A,2A,4C4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"D32|\"Dm\"d2d2a4d4d2c2d2d2a4d8|\"Bb\"f4f2f2f8f2d2f4d8|\"C\"d2c2d4d8d2c2d2c2d8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"d4d2c2d4A4A2G2A2c2A8|\"Dm\"A4A4A4D2D2F4F4D8|\"Bb\"F4F2D2F4F4F2D2F2D2F4D4|\"C\"G4G4G4G4G4G2F2G8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"A2A2A2G2A2G2A2G2A2G2A4d8|\"Dm\"d2d2a4d8d2d2a4d4d2c2|\"Bb\"f2f2f2d2f2d2f2d2f4f2d2f4d4|\"C\"d2c2c4d6c2d4d4f4f2f2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"d16z16|\"Dm\"A2G2A4A4A2G2A2G2A4D8|\r\nV: Ins\r\nz16d'4c'4a4g4|Z|\r\n% verse\r\nV: Vocal\r\n\"Dm\"D4D2C2D2C2D2C2D2C2D2C2F4D4|\"Bb\"F4F4F4D2D2F4F4D8|\"C\"G4G4G4G8z8F2G2|\"Dm\"A2A2A2G2A2A2A2G2A2G2A4d8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Bb\"d4d2c2d4d4f4f2d2f4d4|\"C\"d2c2d4d2c2d4d4d2c2A8|\"Dm\"A2G2A4D16z8|\"Dm\"D2D2D2C2D4D4D4D2C2D8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Bb\"F4F2D2F4F8z8F2D2|\"C\"G2G2G2F2G4G4G4G2F2G2A2D4|\"Dm\"D16z16|\"Dm\"A2G2A4D4A2G2A2G2A4D4D4|\r\nV: Ins\r\nZ2|z16d'4c'4a4g4|Z|\r\nV: Vocal\r\n\"Bb\"F4F4F4F8z8F4|\"C\"G4G4G6F2G2F2G2F2G2F2G2F2|\"Dm\"A4A4A4c4d8c8|\"Dm\"d32|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Dm\"d4a2a2d4d2c2d4a2a2d4d2c2|\"Bb\"f4f2d2f4f4f4f4d8|\"C\"d4g4g4g4g4g2f2a4d4|\"Dm\"d16z16|\r\nV: Ins\r\nZ3|z16d'4c'4a4g4|\r\nV: Vocal\r\n\"Dm\"d2d2a2a2d4d2c2d4a2a2d4d2c2|\"Bb\"f2d2f4f2d2f4f2d2f2d2f4f4|\"C\"g16g4f4d4c4|\"Dm\"d32|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"d8a8g8a6d2|\"Bb\"f4d4f4d4f4f8z4|\"C\"g8g8g8g4g2g2|\"Dm\"a4a4d4d4f4d2c2d8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"d2d2a4d4d2c2d2c2d2c2d2c2f4|\"Bb\"d16z12d2d2|\"C\"g4g4g4g2f2g4a4d4d2c2|\"Dm\"d2c2d4d4c4f8d8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dm\"d4d4d4c4d4A8A4|\"Bb\"G4G4G2F2G2F2G4G2A2D8|\"C\"G6F2G2F2G16z4|\r\nV: Ins\r\nZ3|\r\nV: Vocal\r\nM:9/8\r\n\"C\"z16D4D2C2D3C3D3C3|\r\nV: Ins\r\nM:9/8\r\nZ|\r\nV: Vocal\r\nM:1/4\r\n\"C\"D8-|\r\nV: Ins\r\nM:1/4\r\nZ|\r\nV: Vocal\r\nM:4/4\r\n\"Dm\"D8z24|\"Dm\"z32|\r\nV: Ins\r\nM:4/4\r\nZ2|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
