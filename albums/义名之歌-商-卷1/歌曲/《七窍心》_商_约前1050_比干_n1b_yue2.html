<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=75\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:Em\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ4|\r\nV: Ins\r\nz16z4e12|z4g2a2b24|z4a2b2a2g2e16-e4-|e4z8e2e2d16|\r\nV: Vocal\r\nz24z4B,2D2|\r\nV: Ins\r\nz8A2G2E16z4|\r\n% verse\r\nV: Vocal\r\n\"Em\"E4E2E2E2D2D2E4B,4z6A,2G,2|\"Am\"A,4A,4z16z4B,2D2|\"C\"E2D2E2D2E4E2D2\"D\"E2D4D2D2B,2B,2A,2|\"Em\"B,2A,2B,4B,2A,2B,4B,4z8B,2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E2D2E2D2E2E2E2B,4z4B,2B,2A,2B,4|\"Am\"A,4z24A,2G,2|\"C\"A,2G,4G,2A,2G,2A,2G,2\"D\"A,2G,2A,2G,2A,2G,2B,4|\"Em\"E,4z16z6B,2B,4|\r\nV: Ins\r\nZ|z16B4d4A2B2z4|Z|z16e2g2a2b2a2z6|\r\nV: Vocal\r\n\"C\"E2D2E2D2E2D2E2D2\"D\"E4G4F4D2D2|\"Em\"E4E4z24|\"Em\"z32|\"Em\"E,4E,2E,2E,4E,4B,4A,2B,4B,2B,2A,2|\r\nV: Ins\r\nZ|z16z4e2g2a2b2a2g2|e32|Z|\r\nV: Vocal\r\n\"Am\"A,4A,2G,2A,2G,2A,4A,4z8A,2G,2|\"C\"A,2G,2A,2G,2A,2G,2A,2G,2\"D\"A,4A,4z2B,2B,2A,2|\"Em\"B,2B,4A,2B,2A,2B,2A,2B,4D4B,4z2B,2|\"Em\"E2D2E4E4E4E2D2E4E4E2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"E4A,4z16z4A,2G,2|\"C\"A,2A,6z6G,2\"D\"A,2G,6A,4A,2G,2|\"Em\"E,4z24z4|\"Em\"E2D2E2E4z6E2D2E4G4F2D2|\r\nV: Ins\r\nz16B4d4A2B2z4|Z|z16e2g2a2b2a2g2e2d2|Z|\r\nV: Vocal\r\n\"Am\"E4D4E4E4z12A,2G,2|\"C\"A,2G,2A,2G,2A,2G,2A,4\"D\"A,2G,2A,2G,2A,4B,2A,2|\"Em\"B,2A,2B,4z4B,4E,4E,4z8|\"Em\"E2D2E2D2E2D2E4E4E2D2E4E2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"E4A,4z4B,2A,4z8z2A,2G,2|\"C\"A,2G,2A,2G,2A,4G,2A,2-\"D\"A,4z8G,2E,2-|\"Em\"E,4E,2E,4z16z2E,2E,2|\"Em\"E,2E,4z16E,2E,2E,2E,4|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"z4e4e4B4\"G\"d4d2d4B4B2|\"Am\"A2G2A2G2A2G2A2G2A4B4z8|\"C\"z4e4e4B4\"G\"d4d2d4B2B2B2|\"D\"A2G2A4z6D2A2G2A2G2A4B4|\r\nV: Ins\r\nZ|z24B2d2e2g2|e4z24z4|Z|\r\nV: Vocal\r\n\"Em\"E8z24|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Em\"E,2E,2E,2E,4z2E,2E,2E,2E,2E,2B,6A,2G,2|\"Am\"A,2G,2A,2G,2A,2G,2A,2G,2A,2G,2B,4E,4z4|\"C\"z2E,2E,2E,2E,2E,2E,4\"D\"G,4E,2G,4A,4z2|\"Em\"z2B,2B,2A,2B,4B,2A,2B,4A,2B,6B,2B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E4E2D2E2D2E2D2E4E2D4B,2B,2A,2|\"Am\"B,4A,4z16z4A,2G,2|\"C\"A,8z8\"D\"z12E,2E,2-|\"Em\"E,4z24B,2B,2|\r\nV: Ins\r\nZ|z16B4d4A2B2z4|Z|z16e2g2a2b2a2g2z4|\r\nV: Vocal\r\n\"Em\"E2D2E4E4E2D2E4D2E4D2E2D2|\"Am\"E4E2D2E4E2D2E2D2G4E4z4|\"C\"A,4A,2G,2A,4A,4\"D\"A,4A,2G,2A,4B,4|\"Em\"B,4A,2B,6z16z2B,2|\r\nV: Ins\r\nZ3|z16B4d4A2B2A2z2|\r\nV: Vocal\r\n\"Em\"E2D2E4E2D2E2D2E2D2G4E4E2D2|\"Am\"E2D2E2D2E2D2G4E4z12|\"C\"A,2A,6z6G,2\"D\"A,4G,8G,4|\"Em\"G,4E,4z24|\r\nV: Ins\r\nZ3|z16e2g2a2b2a2g2e2d2|\r\nV: Vocal\r\n\"Em\"E,2E,2E,2E,2E,2E,4E,2B,4B,2B,2B,2A,2A,2G,2|\"Am\"A,2G,2A,2G,2A,2G,2A,4A,2G,2A,4B,4B,2B,2|\"C\"E2D2E2D2B,4B,2A,2\"D\"B,2A,2B,4B,4B,2A,2|\"Em\"B,4B,2A,2B,4E,4z12E,2E,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E,4z8E,2E,2E,2E,4E,2E,2E,2G,4|\"Am\"E,4E,4z16z4A,2G,2|\"C\"A,2G,2A,2G,2A,2G,2A,4\"D\"A,2G,2A,2G,2A,4B,2A,2|\"Em\"B,2A,2B,2A,2B,2A,2B,4B,4B,2D4B,4B,2|\r\nV: Ins\r\nZ|z16B4d4A2B2z4|Z2|\r\nV: Vocal\r\n\"Em\"E4E4E4E2D2E2D2E4z4E2D2|\"Am\"E4A,4z16z4A,2G,2|\"C\"A,2G,2A,4z6G,2\"D\"A,2A,6A,2G,6|\"Em\"B,2A,2B,4B,2A,2B,2A,2B,4B,2A,2B,4B,4|\r\nV: Ins\r\nZ|z16B4d4A2B2z4|Z2|\r\nV: Vocal\r\n\"Em\"B,2A,2E,4E,4z2E,2B,4B,4A,4G,4|\"Em\"E,4z24z4|\r\nV: Ins\r\nZ|z16e2g2a2b2a2g2e2d2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"z4e4e4B4\"G\"d4d2d4B4B2|\"Am\"A2G2A2G2A2G2A2G2A4B8z4|\"C\"z4e4e4B4\"G\"d4d2d4B2B2B2|\"D\"A2G2A4z6D2A2G2A2G2A4B4|\r\nV: Ins\r\ne4z24z4|Z3|\r\nV: Vocal\r\n\"Em\"E8z16z4E,2E,2|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Em\"E,2E,6E,4E,4B,2B,4B,2B,2A,2A,2G,2|\"Am\"A,4A,2G,2A,2G,2A,2G,2A,2G,2A,2G,2B,4B,2B,2|\"C\"E4E2D2E2D2E4\"D\"E4z4E4E2D2|\"Em\"E4E2D2G4E8E2D2E4B,2B,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"B,4B,2A,2B,4A,4B,2A,4z8z2|\"Am\"A,4A,2A,6B,4B,4A,4z8|\"C\"z16\"D\"z16|\"Em\"z32|\r\nV: Ins\r\nZ|z24B4d4|e16g8a8|e16e2g2a2b2a2g2e2d2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"z4e4e4B4\"G\"d6B6A2G2|\"Am\"A8A4G2A4B8z6|\"C\"z4e4e4B4\"G\"d4d2d4B2B2B2|\"D\"A2G2A8z2G2A2G2A2G2A4B4|\r\nV: Ins\r\ne4z24z4|Z3|\r\nV: Vocal\r\n\"Em\"E4e4e4B4\"G\"d6B6A2G2|\"Am\"A8A4G2A4B8z6|\"C\"z4e4e4B4\"G\"d4d2d4B2B2B2|\"D\"A2G2A8z2D2A2G2A2G2A4B4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E8z16z4B,2D2|\"Em\"E4E4E2D2E4E2D2B,4D2B,6|\"Am\"A,2G,2A,2G,2A,4z16z4|\"C\"z16\"D\"z16|\r\nV: Ins\r\nZ2|z16B4d4A2B2A2G2|E16G8A8|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z4e4e4B4\"G\"d4d2d4B4B2|\"Am\"A2G2A2G2A2G2A2G2A4B8z4|\"C\"z4e4e4B4\"G\"d4d2d4B2B2B2|\r\nV: Ins\r\nE16e2g2a2b2a2g2e2d2|e4z24z4|Z2|\r\nV: Vocal\r\n\"D\"A2G2A8z2D2A2G2A2G2A4B4|\"Em\"E8z16z4B,2D2|\"Em\"E4E4E2D2E4\"G\"E2D2B,4D2B,6|\"Am\"A,2G,2A,2G,2A,4z16z4|\r\nV: Ins\r\nZ3|z16B4d4A2B2A2G2|\r\nV: Vocal\r\n\"C\"z16\"D\"z16|\"Em\"z32|\"Em\"z4e4e4B4\"G\"d6B6A2G2|\"Am\"A8A4G2A4B8z6|\r\nV: Ins\r\nE16G8A8|E16e2g2a2b2a2g2e2d2|e4z24z4|Z|\r\nV: Vocal\r\n\"C\"z4e4e4B4\"G\"d4d2d4B2B2B2|\"D\"A2G2A8z2D2A2G2A2G2A4B4|\"Em\"E8z16z4E,2E,2|\r\nV: Ins\r\nZ3|\r\n% verse\r\nV: Vocal\r\n\"Em\"E,2E,4z6E,2E,2E,4E,2E,2B,4B,4|\"Am\"A,2G,2A,2G,2A,4z16z4|\"C\"z16\"D\"z16|\"Em\"z32|\r\nV: Ins\r\nZ|z16B4d4A2B2A2G2|E16G8A8|E16e2g2a2b2a2g2e2d2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"z4e4e4B4\"G\"d4d2d4B4B2|\"Am\"A2G2A2G2A2G2A2G2A4B8z4|\"C\"z4e4e4B4\"G\"d4d2d4B2B2B2|\"D\"A2G2A8z2D2A2G2A2G2A4B4|\r\nV: Ins\r\ne4z24z4|Z3|\r\nV: Vocal\r\n\"Em\"E8z16z4E,2E,2|\"Em\"E,2E,6E,2E,2E,4E,2E,2E,4B,4B,4|\"Am\"A,2G,2A,2G,2A,4z16z4|\"C\"z16\"D\"z16|\r\nV: Ins\r\nZ2|z16B4d4A2B2A2G2|E16G8A8|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nE16e2g2a2b2a2g2e2d2|e32|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
