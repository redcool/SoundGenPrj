<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=74\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:G\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ2|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ2|z4E4B4B4A8A4G4|E8z4e2z6d4B4A4|\r\nV: Vocal\r\n\"Cmaj7\"z32|\"Cmaj7\"z32|\r\nV: Ins\r\nB8B4B4A8A4G4|E12E4G8A8|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2E2E2E2E4B,2B,2D2D2D2D2D4B,2A,2|\"G\"A,4B,2B,6z16B,2D2|\"Am\"E2E2E2E2E2D2D2D2D4B,2B,4z2B,2A,2|\"G\"B,4B,2A,2B,4A,4A,2B,4A,2B,4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,4A,2A,2A,4B,4D4B,4z4A,2G,2|\"Em\"A,2B,4A,2B,4A,4z16|\"D\"A,2G,2A,2A,2z8A,2G,2A,2G,2A,4z4|\"Em\"G,2E,2z8G,2E,4z8z2B,2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E4E2E2E4E2E4D2D2D2D4D2B,2|\"G\"D4B,4z16z6B,2|\"Am\"E4E4E4D4D4B,2B,4B,2B,2A,2|\"G\"B,2A,2B,2A,2B,4B,2A,2B,4A,2B,4z2A,2G,2|\r\nV: Ins\r\nZ|z12D4E8G4A2z2|Z2|\r\nV: Vocal\r\n\"Am\"A,4A,4z6G,2A,2G,2A,2G,2A,4A,2G,2|\"Em\"B,4B,2B,2B,4D2E4z8B,2D4|\"D\"E2D2E4E4D4E4D2E4z6|\"C\"E2E4E2D4E4z16|\r\nV: Ins\r\nZ3|z16B8A4G4|\r\nV: Vocal\r\n\"Am\"z4A,2A,2A,2A,2A,2G,2A,2G,2A,2G,2A,2B,4G,2|\"Em\"E,4D,2E,6z16B,2D2|\"Em\"E4E4E4E2E2E4D4D4B,2D2-|\"G\"D2B,2D2B,2D4D2B,2B,4z8z2B,2|\r\nV: Ins\r\nE4z24z4|Z3|\r\nV: Vocal\r\n\"Am\"E2E2E2E2E4D2D4B,4B,2B,2A,2B,2A,2|\"G\"B,4B,2A,2B,4A,2B,4z6B,2A,4z2|\"Am\"z4A,2A,2A,2G,2A,2G,2A,4G,2A,4B,4z2|\"Em\"z4B,2B,2B,2A,2B,2A,2B,2B,4B,4A,2B,2A,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D\"B,4A,4z8G,2E,4z6E,2G,2|\"Em\"E,4E,2E,6D,4E,4z4B,2A,2B,4|\"Em\"E2E4E2E4D4D4D4D2D4B,2|\"G\"D2B,4z16z6B,2A,2|\r\nV: Ins\r\nZ3|z12D4E4G4A4z4|\r\nV: Vocal\r\n\"Am\"A,8B,8A,4G,4A,4E,4|\"Em\"z32|\r\nV: Ins\r\nZ|z8B8A4G4E8|\r\n% chorus\r\nV: Vocal\r\n\"Em\"G2E4z2G2E4D2D2D2D4E4z4|\"G\"D4D2D2D4B,2B,2B,2A,2B,4G,4z4|\"Am\"G2E4z2G2E4D2D2D2D4E4z4|\"Em\"B,2A,4z6A,2G,2A,4A,4B,4G,2E,2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E,2z24z6|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2E2E2E2E2D2D2D2D2D4B,2D4B,2B,2|\"G\"A,2B,4B,4z16z2B,2D2|\"Am\"E2E4D2E4D2E4E4z2E4D2B,2|\"G\"D4z16z4B,2A,2B,2A,2-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"A,4A,2A,2A,2A,4G,2A,4A,2A,2A,2B,4A,2|\"Em\"B,4B,4B,4B,2A,2B,4A,2G,4z6|\"D\"z2A,2A,2G,2A,2G,2A,4A,2G,2A,2B,4B,2B,2B,2|\"Em\"B,2B,2B,2A,2B,4z4G,2E,2E,4z4E,2D,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E,4z24E2D2|\"Em\"E4E2E4E4E2E4D2D2D2B,2D4|\"G\"D4B,2D4B,4z12z2B,2D2|\"Am\"E4E2E4E6E4D2D4B,6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"G\"B,2A,2B,2A,2B,2A,2B,2A,2B,2A,2B,4B,2A,2B,4|\"Am\"B,2A,2A,2G,2A,4G,2A,4G,2A,2G,4z4E,2|\"Em\"B,2A,2B,4B,4B,2A,2B,4z8B,2D2|\"D\"E2D2E2D2E2D2E2D2D4E4z4E2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E4D2E4E4D2G4E8z4|\"Em\"z32|\"Em\"E4E4E2D2B,4z4D2B,2B,4z4|\"G\"D4D2B,2B,2B,4A,2B,4B,4z8|\r\nV: Ins\r\nZ|B16A4G4E8|Z2|\r\nV: Vocal\r\n\"Am\"E2E6E2D4B,2D2B,2D4D2B,2B,4|\"G\"z32|\"Am\"B,2A,4G,2A,2A,6A,2G,2A,2G,2A,2B,4z2|\"Em\"B,2A,2B,2A,2B,2A,4z2B,2A,2B,4B,2A,2B,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D\"z12z2D,2B,4A,2G,2A,2G,6|\"Em\"A,4G,2E,2E,4z16z4|\r\nV: Ins\r\nZ2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"G2E4z2G2E4z2D2D2D4E4E2D2|\"G\"E4D2B,2D4D2B,2D2B,4B,4z6|\"Am\"G2E4z2G2E4z2D2D2D4E4E4|\"Em\"B,2A,2B,4z4A,2G,2A,2G,2A,2G,4G,2A,2G,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"A,4E,4z16z6B,2|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2D4E6E2D2B,2D4B,2D4D2B,2|\"G\"D4B,4z16z6B,2|\"Am\"E4D2E6E2D2B,2D4B,2D4B,2D2-|\"G\"D2B,6z16z4B,2A,2|\r\nV: Ins\r\nZ|z12d4e8g4a2z2|Z|z12d4e8g2a2z4|\r\nV: Vocal\r\n\"Am\"A,2A,4G,2A,2A,4G,2A,4A,4A,2B,4A,2|\"Em\"B,4A,2B,4B,4A,2B,4A,2G,6z4|\"D\"B,2A,4G,2A,4A,2G,2A,2A,4G,2B,6B,2|\"Em\"B,2A,2B,4B,4B,2A,2B,4D2E8z2|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"G2E4E2G4E2D2D2D2D4E8|\"G\"E2D4z2E2D4B,2B,2A,2B,4A,4z4|\"Am\"G2E6G2E4D2D2D2D4E8|\"Em\"B,2A,4G,2A,2G,2A,4A,2G,2A,4B,8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G2E4E2G4E2D2D2D2D4E8|\"G\"E2D4z2E2D4B,2B,2A,2B,4A,4z4|\"Am\"G2E6G2E4D2D2D2D4E8|\"Em\"B,2A,4G,2A,2G,2A,4A,2G,2A,4B,8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G2E4E2G4E2D2D2D2D4E8|\"G\"E2D4z2E2D4B,2B,2A,2B,4A,4z4|\"Am\"G2E6G2E4D2D2D2D4E8|\"Em\"B,2A,4G,2A,2G,2A,4A,2G,2A,4B,8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G2E4E2G4E2D2D2D2D4E8|\"G\"E2D4z2E2D4B,2B,2A,2B,4A,4z4|\"Am\"G2E6G2E4D2D2D2D4E8|\"Em\"B,2A,4G,2A,2G,2A,4A,2G,2A,4B,8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"G2E4E2G4E2D2D2D2D4E8|\"G\"E2D4z2E2D4B,2B,2A,2B,4A,4z4|\"Am\"G2E6G2E4D2D2D2D4E8|\"Em\"B,2A,4G,2A,2G,2A,4A,2G,2A,4B,8|\r\nV: Ins\r\nZ4|\r\n% outro\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nz4E4B4B4A8A4G4|E8z4e8d4B4A4|B8B4B4A8A4G4|E8z4E4G8A8|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nB32|Z3|\r\nV: Vocal\r\n\"Am\"z32|\"Am\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am7\"z32|\"Am7\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ4|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
