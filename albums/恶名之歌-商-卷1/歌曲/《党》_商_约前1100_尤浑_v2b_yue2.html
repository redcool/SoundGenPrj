<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=120\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:D#m\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nZ|D8A8G4A4c4A4|A16G4A4F4E4|D8A8G4A4c4A4|\r\nV: Vocal\r\n\"D#m\"z32|\"B\"z32|\"C#\"z32|\"D#m\"z32|\r\nV: Ins\r\nA16G4A4F4E4|D16z8F8|E16C16|D32-|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nD16z16|D4D4A4A4G4A4c4A4|A16G4A4F4E4|D4D4A4A4G4A4c4A4|\r\nV: Vocal\r\n\"D#m\"z32|\"B\"z32|\"C#\"z32|\"D#m\"z32|\r\nV: Ins\r\nA16G4A4F4E4|D24F8|E16C16|D32-|\r\nV: Vocal\r\n\"D#m\"z32|\r\nV: Ins\r\nD32|\r\n% verse\r\nV: Vocal\r\n\"D#m\"A8D4D4D4C4D8|\"D#m\"z12C4D4F4D4C4|\"D#m\"A,8z24|\"D#m\"z16z4A,4A,4C4|\r\nV: Ins\r\nZ2|z16G4A4c4A4|A16z16|\r\nV: Vocal\r\n\"B\"D8D4C4D8z4F4|\"C#\"E4D4E8E8C8|\"D#m\"A,8z24|\"D#m\"z16z4D4D4C4|\r\nV: Ins\r\nZ2|z16G4A4c4A4|A16z16|\r\nV: Vocal\r\n\"D#m\"D8z12D4D4C4|\"D#m\"D4C4D4A,8D4D4C4|\"B\"D8z12D4D4C4|\"B\"D4C4F4D8A,4D4C2C2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"D4C4C8z12A,4|\"C#\"E4D4E8E4D4E4D4|\"D#m\"E8F8F4D4F8|\"D#m\"D8z12d4d4c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d8A8z12A4|\"D#m\"c4d4c4d8d4d4f4|\"B\"d8d4c4c4A4c4A4-|\"B\"A8z12d4d4c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"d8c8c4A4c4G4-|\"C#\"G8z8G4F4G4A4-|\"D#m\"A8z8G4F4G4D4-|\"D#m\"D8z12d4d4c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d8a8z12c4|\"D#m\"d4c4f4d12d4c4|\"B\"d8a8g4f4d4f4-|\"B\"f12z16c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"e16e16|\"C#\"c16A16|\"D#m\"d32-|\"D#m\"d32|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d8a8d8d4c4|\"D#m\"d4d4a8d8z8|\"B\"d4d4a8d12c4|\"B\"d4d4a8d8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"d8a8d16|\"C#\"d4d4a8d4c4d4c4|\"D#m\"d4A4A8A4G4A4A4-|\"D#m\"A4D12z16|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"D#m\"D4D2D2D4z4D2D2D2C2D6C2|\"D#m\"D2D2D4D4C4D2D2C4D8|\"B\"D4D4D4C2C2D2D2C4D4z4|\"B\"D4D2D2D4C4D2D2C4F4D4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"E4E4E8E4E4E4E4|\"C#\"E8F8E4D4D4C4|\"D#m\"D8D4C4D4D4C4D4-|\"D#m\"D12z12d4d4|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"a8d4d4d4c4d8|\"D#m\"d8a8d8d4c4|\"B\"d8a8g4f4d4f4-|\"B\"f12z12d4c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"e4e4e8e16|\"C#\"e8f8e8d4c4|\"D#m\"d4c4d8d4c4d4c4|\"D#m\"d16z4D2C2D2C2D2C2|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"D#m\"D4D4D2D2D2C2D4D2C2D4C4|\"D#m\"D8z12D2C2D4D2C2|\"B\"D2C2D4D4D2C2D4D4D2C2C4|\"B\"F4D8z8D2C2D4D2C2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"E4E2E2E4E4E4E2E2E4D4|\"C#\"E4E4F4E8D2C2D4C4|\"D#m\"D2C2D2C2D2C2D2C2D4D2C2D4C4|\"D#m\"D4D4F4D8d2c2d2c2d2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d4d2c2d4d2c2d4d2c2d4c4|\"D#m\"d4d4f4d8d4d4c4|\"B\"d2c2d2c2d2c2d2c2d2c2d4d4c4|\"B\"d4d4f4f8d4d4c2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"e4e4e8e2e2e4e8|\"C#\"e2e2e2e2f4f4e8d4c4|\"D#m\"d2c2d4d4c4d4c2c2d4d2c2|\"D#m\"d4d4f4d16z4|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d4a4a8d8d8|\"D#m\"d8a8d8d4c4|\"B\"d8a8d8d4c4|\"B\"d8a8d8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"e4e2e2e4e2e2e4e2e2e4e4|\"C#\"e4e4e4f4e2e2d4d4c2c2|\"D#m\"d4d4d4c4d4c4d4d2c2|\"D#m\"d4d4d4c4d4c4d8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d4a4a8d8d4c4|\"D#m\"d8a8d16|\"B\"d8a8d12c4|\"B\"d8a8g8f8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"e32|\"C#\"c16A16|\"D#m\"d32-|\"D#m\"d32|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d8a8d8d4c4|\"D#m\"d4d4a8d8z8|\"B\"d4d4a8d12c4|\"B\"d4d4a8d8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#\"d8a8d12c4|\"C#\"d4d4a8d4d4d4c4|\"D#m\"d4c4A8A4G4A4A4-|\"D#m\"A4D8C4F8D8|\r\nV: Ins\r\nZ4|\r\n% outro\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"B\"z32|\"B\"z32|\r\nV: Ins\r\nd8a8g4a4c'4a2z2|a16g4a4f4e4|d8a8g4a4c'4a2z2|a16g4a4f4e4|\r\nV: Vocal\r\n\"C#\"z32|\"C#\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nd16d8f8|e16c16|d32-|d32|\r\nV: Vocal\r\n\"D#m\"z32|\r\nV: Ins\r\nZ|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
