<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/16\r\nQ:1/4=110\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:D#m\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nz8\"D#m\"z8|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ2|z8z2d2f2g2|a16|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ|z4Dz8z3|Z2|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ2|D2DD2DD2DD2DD2D2|D2DD2DD2DD2DF2E2|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nD2DD2DD2DD2DD2D2|D2DD2DD2DD2DF2E2|D2DDzDDzDDzDDzDz|DzDDzDDzDDzDF2E2|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nDzDDzDDzDDzDDzDz|DzDDzDDzDDzDF2E2|D2DD2DD2DD2DD2D2|D2DD2DD2DD2DF2E2|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nD2DD2DD2DD2DD2D2|D2DD2DD2DD2DF2E2|D2DDzDDzDDzDDzDz|DzDDzDDzDDzDF2E2|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nD2DDzDDzDDzDDzDz|D2DDzDDzDDzDF2E2|\r\n% verse\r\nV: Vocal\r\n\"D#m\"DDD2D2zA,C2D2D2A,A,|\"D#m\"CDD2D2A,A,CDD2D2A,A,|\"B\"CDDDD2A,2CDDDD2A,2|\"C#\"C2CCCCCCCDDDD2z2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"C2DDD2zA,CDDDD2A,2|\"D#m\"C2DDD2zA,CDD2D2A,A,|\"B\"C2D2D2A,2C2D2D2A,2|\"C#\"C4D4z8|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"D2D2A2A2GAA2A4|\"D#m\"GAA2A2GAGAA2D4|\"B\"D2D2A2A2GAA2A4|\"C#\"GGGFG2GFA2D2D4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nD4D3zD3zD3z|D3zD3zD3zD3z|\r\n% verse\r\nV: Vocal\r\n\"D#m\"DDD2D2A,2C2D2D2A,A,|\"D#m\"CDDDD2A,2CDD2D2A,2|\"B\"CDD2D2A,2C2D2D2A,A,|\"C#\"C2D2DCDCD2D2D2A,2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"CDD2D2A,2CDD2D2A,2|\"D#m\"CDDDD2A,A,z4F,F,F,F,-|\"B\"F,F,3z12|\"C#\"z16|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d2d2d2d2cddcd2d2|\"D#m\"cdd2dddcd2d2d4|\"B\"cddcd2dccddcd3c|\"C#\"cdd2d3ccdd2d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"cdddd2dccdd2d4|\"D#m\"cd2cd2c2d2d2d2cc|\"B\"cddcdcdcdcdcdcdc|\"C#\"dcdcd2d4z4AA|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"D#m\"A2A2A2A2GAAAA2A2|\"D#m\"GAAAAAA2AAA2A2AA|\"B\"A2A2A2AAAAA2A4|\"C#\"AAAAAAAAD2D4z2|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"D2DDA2A2GAAAGAA2|\"D#m\"GAA2GAAAGAA2D4|\"B\"CDDDCDDDCDDDCDD2|\"C#\"CDDDCDD2D4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"CDD2D2DCD2D2D2A,2|\"D#m\"CDDCD2DCD4z4|\"B\"CDD2D2DCD2D3A,A,A,|\"C#\"C2D2DCD2D4DCD2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"D4z12|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nz4D3zD3zD3z|D3zD3zD3zD3z|DDDDDDDDDDDDDDDD|DDDDDDDDDDDDD4|\r\n% interlude\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"B\"z16|\"C#\"z16|\r\nV: Ins\r\nD2DDD2D2CDD2D2A,2|CDD2D2A,2CDD2D2A,2|CDD2D2A,2CDD2D2A,2|CDD2D2A,2CDD2D4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"B\"z16|\"C#\"z16|\r\nV: Ins\r\nCDDDD2D2CDD2D2A,2|CDD2D2A,2CDD2D2A,2|CDDDD2A,2CDDDD2A,2|CDDDDDDDD4z4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"D2D2A2A2GAA2A4|\"D#m\"GAA2A2GAGAA2D4|\"B\"D2D2A2A2GAA2A4|\"C#\"GGGFG6A2D2C2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"D4z12|\"D#m\"z8z2A2D2C2|\"B\"D4z12|\"C#\"z8z2A2D2C2|\r\nV: Ins\r\nz6D2zDz4D2|z3Dz12|Z2|\r\n% outro\r\nV: Vocal\r\n\"D#m\"D4z12|\"D#m\"z16|\"B\"z16|\"C#\"z16|\r\nV: Ins\r\nz4d2d2cdd2d2A2|cdd2d2A2cdd2d2A2|cdd2d2A2cdd2d2A2|cdd2d2A2cdd2d4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"B\"z16|\"C#\"z16|\r\nV: Ins\r\ncdddd2d2cdd2d2A2|cdd2d2A2cdd2d2A2|cdddd2A2cdddd2A2|cdddddddd4d4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nd4d4d4z4|Z|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
