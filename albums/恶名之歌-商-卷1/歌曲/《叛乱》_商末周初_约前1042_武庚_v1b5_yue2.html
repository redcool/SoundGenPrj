<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=95\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:Em\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ|e'16z16|Z|b2z24z6|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"D\"z32|\"C\"z32|\r\nV: Ins\r\nZ|e4b4a4b4e8d4e4|d4B16z12|e4b4a4b4e8d4g4|\r\nV: Vocal\r\n\"D\"z32|\"Em\"z32|\"D\"z32|\"C\"z16\"D\"z16|\r\nV: Ins\r\nf2g2f2d2A24|z8e4b4a8b8|f16d8f8|e8b8a16|\r\nV: Vocal\r\n\"Em\"z32|\r\nV: Ins\r\ne32|\r\n% verse\r\nV: Vocal\r\n\"Em\"E4E4E4B4B8z8|\"D\"A4B4A4D4D4z12|\"C\"E4E4E4E2E2G4G4G4z4|\"D\"A4G4A4B4\"G\"B8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"B4B4e4d4e6d6B4|\"D\"B2A6z12A2A2B4E4|\"C\"z8G4E2G6z8D4|\"D\"A4G2A6D4\"Em\"G8E8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"E2E2E2E2E4D4E4z4E4G4|\"D\"A4A2A2A2A2D4D4z12|\"C\"E2E2E2E2E4D4E4G8G4|\r\nV: Ins\r\ne2B2e2B2d2B2d2B2e2B2e2B2f2B2f2B2|Z3|\r\nV: Vocal\r\n\"D\"A4G4A4B4\"G\"B8z4B4|\"Em\"B4B4e4d8z8B2A2|\"D\"B4A8B4D8z8|\"C\"E4D4E8E4D2D2E8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D\"z8A4G4\"Em\"G8E8|\"Em\"z32|\"Em\"E2E2E2E2E4B4B8B4B2B2|\"D\"A4A2G2A4D4z16|\r\nV: Ins\r\nZ|e2B2e2B2d2B2d2B2e2B2e2B2f2B2f2B2|Z|z16z4d4g4f4|\r\nV: Vocal\r\n\"C\"z4E4E4D4E4E4E4D4|\"D\"E4G4G4A4\"G\"B8z8|\"Em\"B8e8B4d8B2A2|\"D\"B4A2G2A4B4D8z8|\r\nV: Ins\r\ne4z24z4|Z3|\r\nV: Vocal\r\n\"C\"E2E2E2E2E4D2D2E4G12|\"D\"A6A6B4\"Em\"G4E4E8-|\"Em\"E24z8|\r\nV: Ins\r\nZ3|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4b4a4b4\"C\"e4b4a4b4|\"D\"d4d2d2d4d2d2\"G\"d2B2A4B8|\"Am\"e4b4a4b4\"C\"e4b4a4b4|\"D\"d2d2d2d2d4B4\"Gmaj7\"d2d2d2d2g4e4-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e16-e4z12|\r\nV: Ins\r\nZ|\r\n% verse\r\nV: Vocal\r\n\"Em\"E4E2D2E4z4E4E2D2E4z4|\"D\"D8D4B,4D8z8|\"C\"E4E4E4D4E8G8|\"D\"A4G4A4B4\"G\"B8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4B2B2d8e4B2B2d8|\"D\"B6A6B4D8z6D2|\"C\"E2E2E2E2E2E2E2E2G4E8D4|\"D\"A8B8\"Em\"G4E4E8-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E16z16|\"Em\"e4e4d4e4z8B4d4|\"D\"d4d8e4d8z8|\"C\"e4e4e4d4e16|\r\nV: Ins\r\nz16e2B2e2B2f2B2f2B2|Z3|\r\nV: Vocal\r\n\"D\"g6g6d4\"G\"B8z8|\"Em\"e4B4d8e4B4d8|\"D\"B2A2A2G2A4B4D8z8|\"C\"E4E2D2E4E2D2E4G12|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D\"A4G4A4G4\"Em\"E16-|\"Em\"E16z16|\"Em\"E4E2E2E4B12B4B4|\"D\"A4A2G2A4D8z12|\r\nV: Ins\r\nZ|z16e2B2e2B2f2B2f2B2|Z|z16z4d4g4f4|\r\nV: Vocal\r\n\"C\"z4E2E2E4D4E4E4E4D4|\"D\"E4G2G2G4A4\"G\"B8z8|\"Em\"e4B4d4d4e4B2B2d8|\"D\"z8A2A2B4D8z6B,2|\r\nV: Ins\r\ne4z24z4|Z3|\r\nV: Vocal\r\n\"C\"E4E4D4E16D4|\"D\"A4A12A6B6D4|\"Em\"E32-|\"Em\"E32|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4b4a4b4\"C\"e4b4a4b4|\"D\"d4d2d2d4d2d2\"G\"d2B2A4B8|\"Am\"e4b4a4b4\"C\"e4b4a4b4|\"D\"d2d2d2d2d4B4\"G\"d2d2d2B2g4e4-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e16-e4z12|\"Em\"e4b4a4b4\"C\"e4b4a4b4|\"D\"d4d2d2d4d2d2\"G\"d2B2A4B8|\"Am\"e4b4a4b4\"C\"e4b4a4b4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D\"d2d2d2d2d4B4\"G\"d2d2d2B2g4e4-|\"Em\"e16-e4z12|\"Em\"e4b4a4b4\"C\"e4b4a4b4|\"D\"d4d2d2d4d2d2\"G\"d2B2A4B8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"e4b4a4b4\"C\"e4b4a4b4|\"D\"d2d2d2d2d4B4\"G\"d2d2d2B2g4e4-|\"Em\"e16-e4z12|\r\nV: Ins\r\nZ3|\r\n% outro\r\nV: Vocal\r\n\"Em\"z32|\"D\"z32|\"C\"z32|\"D\"z32|\r\nV: Ins\r\ne2z24z6|f8z16z4f4|e8z16z4e4|f8z24|\r\nV: Vocal\r\n\"C\"z32|\"D\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\ne8z16z4e4|f8z16z4f4|e32|Z|\r\nV: Vocal\r\n\"Em\"z32|\"D\"z32|\"C\"z32|\"D\"z32|\r\nV: Ins\r\ne4b4a4b4e8d4e4|d4B24z4|e4b4a4b4e8d4g4|f2g2f2d2A24|\r\nV: Vocal\r\n\"Em\"z32|\"D\"z32|\"C\"z16\"D\"z16|\"Em\"z32|\r\nV: Ins\r\ne4b4a4b4e8d4e4|d4B24z4|e4b4a4b4e8d8|e32|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ2|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
