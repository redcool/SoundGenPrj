<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }

  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }

    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>

  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=125\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:D#m\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ4|\r\nV: Ins\r\nZ|z8D8A16-|A8z4G4G4A4c8|Z|\r\nV: Vocal\r\nZ|\r\nV: Ins\r\nZ|\r\nV: Vocal\r\nM:5/8\r\nZ|\r\nV: Ins\r\nM:5/8\r\nZ|\r\nV: Vocal\r\nM:4/4\r\nz24\"D#m\"z8|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nM:4/4\r\nZ|D,2D,2D,2D,2D2=E2D,2C2z2D,2E2D2D,2C2A,2D,2|D,2D,2D,2D,2D2=E2z2C2z4E2D2F4E4|D,2D,2D,2D,2D2=E2z2C2z4E2D2z2C2A,4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nz16F4=E4D4C4|D,2D,2D,2D,2D4z2C2z4=E2D2z2C2A,4|D,2z2D,2D,2D2=E2z2C2z4E2D2F4E4|D,2z2D,2D,2D4z2C2z4=E2D2z2C2A,4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nz4=E4D4C4F4E4D4C4|D,4z4d2=e2z2c2z4e2d2z2c2A4|D,2z2D,2D,2d2=e2z2c2z4e2d2f4e4|D,2z6d2=e2z2c2z4e2d2z2c2A4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nz4=e4d4c4f4e4d4c4|D,2z6d2=e2z2c2z4e2d2z2c2A4|D,2z6d2=e2z2c2z4e2d2f4e4|D,2z6d2=e2z2c2z4e2d2z2c2A4|\r\nV: Vocal\r\n\"D#m\"z16z4D4D4D4|\r\nV: Ins\r\nz4=e4d4c4f4z12|\r\n% verse\r\nV: Vocal\r\n\"D#m\"D8D8D4D8D4-|\"D#m\"D4z8D4D4C4D8|\"B\"D8D4D4D4F8E4-|\"C#\"E4z16D4D4D4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"D8D8D4D8C4|\"D#m\"D4F8E8C4C4C4|\"B\"D8D8D4D8C4|\"C#\"D4F8E8z12|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z8A4A4A4A4A8|\"D#m\"A4A4A4A4c4A4A8|\"B\"z4A4A4A4A8A4A4|\"C#\"c8c8c4d8d4-|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d4z24z4|\"D#m\"z32|\"D#m\"z32|\"D#m\"z24D4D4|\r\nV: Ins\r\nz8d2=e2d2c2z4e2d2d2c2A4|D,2z6d2=e2d2c2z4e2d2f4e4|D,2z6D2=E2D2C2z4E2D2D2C2A,4|z4=E4D4C4F4E4z8|\r\nV: Vocal\r\n\"D#m\"D8A4A4A4A4G4F4|\"D#m\"G8A8z4D4D4C4|\"B\"D8A8A4A4F4E4-|\"C#\"E8z12D4D4C4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"D8A8A8z4F4|\"D#m\"G6G6A8D4D4C4|\"B\"D8A8A6G6F4|\"C#\"G6G6A12z8|\r\nV: Ins\r\nZ4|\r\n% pre-chorus\r\nV: Vocal\r\n\"B\"d12c12A8|\"C#\"G12F4G8F4D4-|\"D#m\"D4z24z4|\"D#m\"z32|\r\nV: Ins\r\nZ2|z8D4F4G8F "B\"d4d4d4c4d4f8e4-|\"C#\"e16-e4z4c4c4|\"D#m\"d4d4d4c4d8c4f4-|\"D#m\"f4d8c4d4c4d4c2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"d4d4d4c4d4d4c4e4-|\"C#\"e8z4F,4F,2F,2F,2F,2F,4F,4|\"D#m\"F,8F,4F,4F,8A,8|\"D#m\"z32|\r\nV: Ins\r\nZ3|z16f16|\r\n% interlude\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"B\"z32|\"C#\"z32|\r\nV: Ins\r\nd16z4A4d4A4|e4A4f4A4e4A4d8|c12d16z4|c12d16z4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"B\"z32|\"C#\"z32|\r\nV: Ins\r\nf2d2c2d2f2d2c2d2f2d2c2d2f2d2c2d2|g2e2d2e2g2e2d2e2g2e2d2e2g2e2d2e2|a16g16|a4g4f4e16z4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nd32-|d32|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d4d4d4d2c2d4c2c2d4c4|\"D#m\"d8z24|\"B\"d4d4d4c4d4f8e4-|\"C#\"e16-e4z4c4c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d4d4d4c4d8c4f4-|\"D#m\"f4d8c4d4c4d4c2c2|\"B\"d4d4d4c4d4d4c4e4-|\"C#\"e8z4F,4F,2F,2F,2F,2F,4F,4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"F,8F,4F,4F,8D,8|\"D#m\"z32|\"D#m\"d4d4d4d2c2d4c2c2d4c4|\"D#m\"d8z24|\r\nV: Ins\r\nZ|D4=E4D4C4F4E4D4C4|Z|z12z2C2z6D2F4=E4|\r\nV: Vocal\r\n\"B\"d4d4d4c4d4f8e4-|\"C#\"e16-e4z4c4c4|\"D#m\"d4d4d4c4d8c4f4-|\"D#m\"f4d8c4d4c4d4c2c2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"d4d4d4c4d4d4c4e4-|\"C#\"e8z4F,4F,2F,2F,2F,2F,4F,4|\"D#m\"F,8F,4F,4F,8D,8|\"D#m\"z16d4d4d4d4|\r\nV: Ins\r\nZ3|D,2z2D,2z2D2=E2D2C2z16|\r\nV: Vocal\r\n\"D#m\"d8a8g4g4f4g4-|\"D#m\"g8z8d4d4d4d4|\"B\"d8a8g4g4f4g4|\"C#\"e4e8z4d4d4d4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d8a8g4g4f4g4-|\"D#m\"g8z8d4d4d4d4|\"B\"d8a8g8f8|\"C#\"g12f12e8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d32-|\"D#m\"d16z16|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nZ|z16z4=e2d2f4e4|D,2z6D2=E2D,2C2D,2z2E2D2z2C2A,4|D,2z2=E4D4C4F4E4D4C4|\r\n% outro\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"B\"z32|\"C#\"z32|\r\nV: Ins\r\nd'16z4a4d'4a4|e'4a4f'4a4e'4a4d'8|c'12d'16z4|c'12d'16z4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"B\"z32|\"C#\"z32|\r\nV: Ins\r\nf2d2c2d2f2d2c2d2f2d2c2d2f2d2c2d2|g2e2d2e2g2e2d2e2g2e2d2e2g2e2d2e2|a16g16|a4g4f4e16z4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nd32-|d32|Z|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
