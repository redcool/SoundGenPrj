<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/16\r\nQ:1/4=120\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:F#\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z8z2d2d2d2|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"D#m\"d2d2d2d2d2d2d2c2|\"D#m\"d2f2z4d2d2d2c2|\"D#m\"d2f2d4d2ddd2cc|\"D#m\"d2f2z6a2g2a2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"g3f3d2g3f3a2|\"C#\"g3f3d2g3f3c2|\"D#m\"c2d2d4z8|\"D#m\"z8z2a2g2a2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"g3f4zg3f4z|\"C#\"g3f4zc4d4|\"D#m\"d4z12|\"D#m\"z8z2a2g2a2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"g6f2g3f4z|\"C#\"g3a8-a3c'2|\"D#m\"d'16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d2d2d2d2z8|\"D#m\"d2d2d2d2z8|\"D#m\"d2d2d2d2z4d2c2|\"D#m\"d2d2d2d2z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"d4d2c2d4d2c2|\"C#\"d4d2c2A4z4|\"D#m\"d4d2c2d4d2c2|\"D#m\"d2c2d2c2A4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d2d2d2d2z4d2cc|\"D#m\"d2ddd2c2d4z4|\"D#m\"d2d2d2c2d4z4|\"D#m\"d2d2d2c2d4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"d2d2d2c2d2d2d2c2|\"C#\"d2d2d2c2A4z4|\"D#m\"d4d2c2d4d4|\"D#m\"d2c2d2c2d2c2d2c2|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"D#m\"z4D2D2D4D2C2|\"D#m\"D4D2C2D2C2D2C2|\"D#m\"D4z12|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"D2D2D2C2D2F4z2|\"C#\"z4D2C2D4C2A,2|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d2d2d2c2d4d2c2|\"D#m\"d2f4z8z2|\"D#m\"d2d2d2c2d4d2c2|\"D#m\"d2f4z8z2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"d4d4d4d4|\"C#\"c4z12|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"DD2DD3CDD2DDD2C|\"D#m\"DD2DDD2DDD2DDD2C|\"D#m\"DD2DDD2CDD2DDD2D|\"D#m\"DD2DDD2DDD2DD2z2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"DD2DDD2CDD2DDD2C|\"C#\"DD2DDD2CDD2DDD2C|\"D#m\"DD2DDD2CDD2DDD2C|\"D#m\"D4D4D4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"DD2DDD2DDD2DDD2D|\"D#m\"DD2DDD2DDD2CD2z2|\"D#m\"DD2DDD2DDD2DDD2D|\"D#m\"DD2DDD2CD4D4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"DD2DDD2DDD2DDD2D|\"C#\"DD2DDD2DD3DD3C|\"D#m\"DD2DDD2CDD2DDD2C|\"D#m\"DD2CDD2CDD2CD4|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d2d2d2d2z8|\"D#m\"d2d2d2d2z8|\"D#m\"d2d2d2d2z4d2c2|\"D#m\"d2d2d2d2z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"d4d2c2d4d2c2|\"C#\"d4d2c2A4z4|\"D#m\"d4d2c2d4d2c2|\"D#m\"d2c2d2c2A4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"a16|\"C#\"g8g4a4|\"D#m\"a16-|\"D#m\"a8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"B\"a12c'4|\"C#\"g8g2g4f2|\"D#m\"d16-|\"D#m\"d8z8|\r\nV: Ins\r\nZ4|\r\n% outro\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nD2D2z2D2z2D2z2D2|z2D2z2D2z2D2=E2E2|D2D2z2D2z2D2z2D2|z2D2z2D2zDDDDDDD|\r\nV: Vocal\r\n\"B\"z16|\"C#\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nB,2B,2z2B,2z2B,2z2B,2|C2C2z2C2zCC2=E2E2|D2D2z2D2z2D2z2D2|D3D3D3DDDDDDD|\r\nV: Vocal\r\n\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nD3D3D3DDDDDDD|D3D3D3DDDDDDD|D3D3D3DDDDDDD|D3D3D3DDDDDDD|\r\nV: Vocal\r\n\"B\"z16|\"C#\"z16|\"D#m\"z16|\"D#m\"z16|\r\nV: Ins\r\nB,3B,3B,3B,B,B,B,B,B,B,|C3C3C3CCCCCCC|D3D3D2zDDDDDDD|D3D3D2zDDDDDDD|\r\nV: Vocal\r\n\"D#m\"z16|\r\nV: Ins\r\nF4z12|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
