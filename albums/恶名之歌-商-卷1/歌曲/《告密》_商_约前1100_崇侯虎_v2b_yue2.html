<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=120\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:D#m\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ4|\r\nV: Ins\r\nZ|z8D8A16|z8A4G4A8c8|Z|\r\nV: Vocal\r\nZ2|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nZ|z8D8A16-|A8A4G4A8c8|d32-|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nd32|D4z4D4z4D4z4D4z4|D4z4D4z4D4z12|D4z12D4z12|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nD4z16z4=E8|D2z24z6|Z|d'32|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nZ|D,4z4D,2z2D,4z4D,4=E,4C,4|D,4z8D,4z4D,4=E,8|D,4z8D,4z4D,4=E,4C,4|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nD,4z8D,4z16|D,4z8D,4z4D,4=E,4C,4|D,4z8D,4z4D,4=E,8|D,4z8D,4z4D,4=E,4C,4|\r\nV: Vocal\r\n\"D#m\"z24A,2A,2A,2A,2|\r\nV: Ins\r\nD,4z8D,4z16|\r\n% verse\r\nV: Vocal\r\n\"D#m\"A,4z4A,2A,2A,4A,2A,2A,2A,2A,4A,4|\"D#m\"A,4G,4G,4A,8z4A,2A,2A,4|\"D#m\"A,4A,4A,2A,2A,2A,2A,4G,4G,4G,4|\"D#m\"G,2G,2G,4G,4G,4G,4F,4D,8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"A,2A,2A,4A,2A,2A,4A,2A,2A,4A,2A,2A,2A,2|\"D#m\"A,2A,2A,2A,2A,2A,2A,4A,8A,2A,2A,4|\"D#m\"A,4A,4A,2A,2A,4A,4G,4G,4G,4|\"D#m\"G,4G,4G,4F,4D,8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"A2A2A4A8A2A2A2A2A4A4|\"D#m\"A2A2A2A2A2A2A4A4A4c8|\"D#m\"A2A2A2A2A4A4A2A2A4G4G2G2|\"D#m\"G4G4G4F4F4D4D8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"A2A2A2A2A4A4A4A4A4z4|\"D#m\"A2A2A2A2A4A4A2A2A4c8|\"D#m\"A2A2A2A2A4A4A2A2A4G4G2G2|\"D#m\"G4G4G4F4F4D4D8|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d4d4d4d4a8a8|\"F#\"c8c8f8e8|\"C#\"d4d4d8a8d4c4|\"G#\"d4d4d4f4e8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d4d4d4d4a8a8|\"F#\"c8c8f8e8|\"C#\"d2d2d2d2d4c4c2c2c4c4d4|\"D#m\"d8z24|\r\nV: Ins\r\nZ4|\r\n% verse\r\nV: Vocal\r\n\"D#m\"A,2A,2A,4A,6A,2A,2A,2A,4A,8|\"D#m\"A,2A,2A,4A,6A,2A,2A,2A,4A,8|\"D#m\"A,2A,2A,2A,2A,4A,4A,2A,2A,4G,4G,4|\"D#m\"G,4G,4G,4F,4F,8D,8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"A,2A,2A,4A,4A,2A,2A,8A,4A,4|\"D#m\"A,4A,4C8A,2A,2A,4A,4A,4|\"D#m\"A,4A,4C8A,2A,2A,4G,4G,4|\"D#m\"G,4G,4G,4F,4D,8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d2d2d4d8d2d2d4d8|\"F#\"c2c2c4c8c2c2c4c8|\"C#\"c2c2c4c8c2c2c4c4A4|\"G#\"A8z16d2d2d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d4d4d2d2d4d2d2d4d4d2d2|\"F#\"c4c2c2c4c4c4c2c2c4A4|\"C#\"A2A2A4A2A2A2A2A4A2A2A4A2G2|\"G#\"G4G4G4G4G4G4G4F4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"D8z24|\r\nV: Ins\r\nZ|\r\n% chorus\r\nV: Vocal\r\n\"D#m\"d8a8a8d4d4|\"F#\"c8c8f8e8|\"C#\"d4d4d8a8d4c4|\"G#\"c8c8f8e8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d2d2d4d4d2d2a4a4a4d4|\"F#\"c4c4c4c4f8e8|\"C#\"d2d2d4d4c4c2c2c4c8|\"D#m\"d2d2d2d2d4c4c2c2c4c4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d8a16z4g4|\"F#\"a8c'16z8|\"C#\"d8a16z4g4|\"G#\"a8d16z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d8a16z4g4|\"F#\"a8c'16z8|\"C#\"d8a16z4g4|\"G#\"a8d2z16z6|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"D4D4D4D4A8A8|\"F#\"C8C8F8E8|\"C#\"D4D4D8A8D4C4|\"G#\"C4C4C4F4E8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"D4D4D4D4A8A8|\"F#\"C8C8F8E8|\"C#\"d2d2d2d2d4c4c2c2c4c4d4|\"D#sus4\"d8z24|\r\nV: Ins\r\nZ3|z16d2z2d2z2d2z2d2z2|\r\nV: Vocal\r\n\"D#m\"d8a16z4g4|\"F#\"a8c'16z8|\"C#\"d8a16z4g4|\"G#\"a8d16z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D#m\"d8a16z4g4|\"F#\"a8c'16z8|\"C#\"d8a16z4g4|\"G#\"a8d16z8|\r\nV: Ins\r\nZ4|\r\n% outro\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nd8a4z12a4g4|a8c'8c'8e8|d8a4z12a4g4|a8d8d8z8|\r\nV: Vocal\r\n\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\"D#m\"z32|\r\nV: Ins\r\nd8a4z12a4g4|a8c'8c'8e8|d8a4z12a4g4|a8d8d8z8|\r\nV: Vocal\r\n\"D#m\"z32|\r\nV: Ins\r\nZ|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
