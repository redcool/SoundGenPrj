<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/32\r\nQ:1/4=110\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:Em\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\nZ|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nZ|z4B,4E4B,4=F4B,4D4E4-|E12z16z4|z4B,4E4B,4=F4B,4D4E4-|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"Cmaj7\"z32|\r\nV: Ins\r\nE12z16z4|z4B,4E4B,4=F4B,4D4E4-|E12z16z4|z4B,4E4B,4=F4B,4D4E4-|\r\nV: Vocal\r\n\"Am\"z32|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nE24-E4z4|D,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,2E,2=F,2E,2D,2E,2|D,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,2E,2=F8|D,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,2E,2=F,2E,2D,2E,2|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nD,2E,2E,2E,2E,2E,2D,2E,2z16|D,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,2E,2=F,2E,2D,2E,2|D,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,2E,2=F8|D,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,2E,2=F,2E,2D,2E,2|\r\nV: Vocal\r\n\"Em\"z16z4B4B4A4|\r\nV: Ins\r\nD,2E,2E,2E,2E,2E,2D,2E,2z16|\r\n% verse\r\nV: Vocal\r\n\"Em\"B4A4B4A4B6B6A4|\"Em\"B4A4B4A4B6E6E4-|\"C\"E4z16D4E4D4|\"Am\"E6G6E8B4B4A4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"B2A2B2A2B4A2B6A4B4A2B2-|\"Em\"B4A4B4A2B6E4z2D2E2D2|\"C\"E4D2E6E4G4G2E6D4|\"Am\"z4E2D2E4D2E4D2E2D2E2D2E2D2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E4z24z4|\"Em\"z32|\"Em\"z32|\"Em\"z16z6A2B4B2A2|\r\nV: Ins\r\nz12E2z16z2|E2z8z2E2z16z2|E2z8z2E2z16z2|E2z8z2E2z16z2|\r\nV: Vocal\r\n\"Em\"B4A4B4A4B4A4B4B2A2|\"Em\"B4B2A2B4B2A2B4E4E4E2D2|\"C\"E4D4E4E4G4E4E4D4|\"Am\"G6E8z6B2A2B4A4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"B2A2B4B4B2A2B2A2B4B4B2A2|\"Em\"B4B2A2B4B2A2B2A2B2A2B4E4|\"C\"E4D2E6E4G4E4E4D4|\"Am\"E4G8E8z12|\r\nV: Ins\r\nZ4|\r\n% pre-chorus\r\nV: Vocal\r\n\"Em\"e8d8e8d8|\"Em\"e8d8e4d4g4g4|\"C\"e32-|\"Am\"e16z16|\r\nV: Ins\r\nZ3|z16A2z2A2z2G2G2G2G2|\r\n% chorus\r\nV: Vocal\r\n\"Em\"b4e4e4e8d4e4d4|\"D\"g4g4e4e12e4d4|\"C\"e4e4e4d4e8z4B4|\"Am\"A4A4A4B4A4E8z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"b8e4e12e4d4|\"D\"g4g4e4e12e4d4|\"C\"e6g6e12e4d4|\"Am\"e6g6e12z8|\r\nV: Ins\r\nZ3|z24G2z6|\r\n% interlude\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"Em\"z32|\"Em\"z32|\r\nV: Ins\r\nD2E2E2E2E2E2D2E2E2E2E2E2=F2E2D2E2|D2E2E2E2E2E2D2E2z16|D2E2E2E2E2E2D2E2E2E2E2E2=F2E2D2E2|D2E2E2E2z4D2E2z4e4z8|\r\n% verse\r\nV: Vocal\r\n\"Em\"E4D4E4D4E4z4D4D4|\"Em\"E6G6G4E8z8|\"C\"E4D4E4D4E8D8|\"Am\"G6E8z6B4B4A4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"B4A4B4A4B8A4A4|\"Em\"B6B8z6B4A4G4|\"C\"A4G4A4G4A6A6G4|\"Am\"G6E8z6E2D2E4D4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E4D2E6E2D2E2D2E4E4E2D2|\"Em\"E6G8z6B4B4A4|\"C\"B8z4A4B6B6A4|\"Am\"B4A4B4A4B8E8|\r\nV: Ins\r\nZ4|\r\n% pre-chorus\r\nV: Vocal\r\n\"Em\"E4E4G4G4A4A8G4|\"Em\"A4G4A4B4B8z4D4|\"C\"E4E4G4G4A4A8G4|\"Am\"A6A6B4B8z4D4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E6G6A12A4G4|\"Em\"A6A6B4B8z4d4|\"C\"e6e6g4g12e2z2|\"Am\"e16g6e6d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"e32|\"Am\"z24z4E2D2|\r\nV: Ins\r\nZ2|\r\n% verse\r\nV: Vocal\r\n\"Em\"E2D2E4E2D2E2D2E2D2E2D2E2D2E2D2|\"Em\"E4E2D2E2D2E2D2E2D2E2D2E4E4|\"C\"E4E2D2E4G4A4A4A4G4|\"Am\"A4A4B4B8z8B4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"B4A2B6B8B4A4G4|\"Em\"A6B8z6B4B4A4|\"C\"B4B4B4A2A2B4B4B4A2A2-|\"Am\"A2G2A2G2A2G2A2G2E4E4z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E2D2E2D2E2D2E2D2E4E2D2E2D2E4|\"Em\"E2D2E2D2E4E2D2G4E4z8|\"C\"E8G8A8B8|\"Am\"d16e16|\r\nV: Ins\r\nZ4|\r\n% chorus\r\nV: Vocal\r\n\"Em\"e4e4g4g4a4a8g4|\"Em\"a4a4a4a2b2b8z4d4|\"C\"e4e4g4g4a6e6d4|\"Am\"e16z8e4d4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e2d2e2d2e2d2e2d2e2d2e4e2d2e2d2|\"Em\"e2d2e4e4g4g8z8|\"C\"e4e2g6g4a4a4a4g4|\"Am\"a6a6b4b8z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"e4e2g6g4a4a4a4g4|\"Em\"a6a6b4b8z8|\"C\"e4e2d2e2d2e2d2e2d2e2d2e2d2e2d2|\"Am\"e4d4g4g8e12|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"b8e4e12e4d4|\"D\"g4g4e4e12e4d4|\"C\"e4e4e4d4e8z4B4|\"Am\"A4A4A4B4A6E6z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"b8e4e12e4d4|\"D\"g4g4e4e12e4d4|\"C\"e6g6e12e4d4|\"Am\"e6g6e12z8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Em\"E8G8A8B8|\"Em\"d16e8z8|\"C\"e8g8a8b8|\"Am\"d'16b4a4b4b4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Am\"b8e24-|\"Am\"e24z8|\r\nV: Ins\r\nZ2|\r\n% outro\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"C\"z32|\"Am\"z32|\r\nV: Ins\r\ne2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2|d2d2d2d2d2d2d2d2^c4c4c4c4|B4B4B4B4B4B4B4B4|A4A4A4A4A4A4A4A4|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"C\"z32|\"Am\"z32|\r\nV: Ins\r\ne4e4e4e4e4e4e4e4|d2d2d2d2d2d2d2d2^c4c2c2c4c4|B4B4B4B4B4B4B4B4|A4A4A4A4A4A4A4A4|\r\nV: Vocal\r\n\"Em\"z32|\"Em\"z32|\"C\"z32|\"Am\"z32|\r\nV: Ins\r\nE,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,2E,2=F,2E,2D,2E,2|D,2E,2E,2E,2E,2E,2D,2E,2E,2E,2E,4=F4F4|D,2E,2E,2E,2E,4D,2E,2E,2E,2E,4=F,2E,2D,4|D,2E,2E,2E,2E,4D,4z16|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
