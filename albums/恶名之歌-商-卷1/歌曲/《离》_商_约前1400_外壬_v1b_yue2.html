<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>曲谱渲染器</title>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  .controls { margin: 0.8rem 0; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  .paper { background: #fff; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #score svg { display: block; margin-inline: auto; }
  #score svg { height: auto !important; max-width: 100% !important; }
  .meta { color: #555; font-size: .85rem; margin-top: .8rem; white-space: pre-wrap; font-family: Consolas, monospace; }
  @page { margin: 1cm; }
  @media print {
    .controls, #ctl, .meta { display: none !important; }
    body { margin: 0; }
    .paper { box-shadow: none; padding: 0; }
    #score svg { width: 100% !important; height: auto !important; max-width: 100% !important; page-break-inside: avoid; break-inside: avoid; }
    html, body, .paper, #score { overflow: visible !important; height: auto !important; }
  }
  /* 播放时音符高亮：事件携带的 SVG 元素加 .playing */
  .playing, .playing * { fill: #ff6b35 !important; }
  .playing, .playing g, .playing path { filter: drop-shadow(0 0 2px rgba(255,107,53,.9)); }
  #ctl { margin: .6rem 0; }
  #ctl .abcjs-midi-progress-background, #ctl .abcjs-midi-progress-indicator { background: #bbb; }
  @media print { .controls, #ctl { display: none } body { margin: 0 } .paper { box-shadow: none } }
</style></head><body>
<h1>曲谱渲染器</h1>
<div class="controls">
  <button onclick="rerender()">⟳ 重绘</button><button onclick="playScore()">▶ 播放曲谱</button><button onclick="stopScore()">⏹ 停止</button>
  <button onclick="window.print()">🖨 打印 / 存 PDF</button>
</div>
<div id="ctl"></div>
<div class="paper"><div id="score"></div></div>
<div class="meta" id="meta"></div>
<script src="abcjs-basic.js"></script>
<script>
const ABC_TEXT = "X:1\r\nT:\r\nM:4/4\r\nL:1/16\r\nQ:1/4=107\r\nV: Vocal clef=treble name=\"Vocal Melody\" snm=\"Vocal\"\r\nV: Ins clef=treble name=\"Ins Melody\" snm=\"Inst.\"\r\nK:F#m\r\n%%barNumbers 1\n% intro\r\nV: Vocal\r\n\"F#m\"z16|\"F#m\"z16|\"F#m\"z16|\"F#m\"z16|\r\nV: Ins\r\nZ|f4z2fzf2f2e2c2|e2e2B2A2B4z4|z12A2B2|\r\nV: Vocal\r\n\"F#m\"z16|\"F#m\"z16|\"F#m\"z16|\"F#m\"z16|\r\nV: Ins\r\nc4z2c2B4A4|F16|Z|z8z2F2A2B2|\r\nV: Vocal\r\n\"F#m\"z16|\"F#m\"z16|\"F#m\"z16|\"F#m\"z12F2F2|\r\nV: Ins\r\nc8z8|Z3|\r\n% verse\r\nV: Vocal\r\n\"F#m\"F4c4B2c2c4|\"F#m\"B2BcB2A2F4z2FF|\"F#m\"F2c2c4B2c2c4|\"F#m\"B2BcB2A2B2c2F2F2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dmaj7\"F2F2F2z2F2F2F2z2|\"Dmaj7\"B2BcB2A2A3FF2FF|\"Bm\"c4z6c2c2c2|\"C#m\"e4c2e2c4z4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F#m\"F2F2c4c4z2F2|\"F#m\"F2F2c4c4z4|\"D\"B2c2B2A2A2F2F2A2|\"E\"B2c2B2A2A4F4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F#m\"z16|\"F#m\"z12z2FF|\"F#m\"F2ccc2c2BcBcc2FF|\"F#m\"F2ccc2ccB2c2c2z2|\r\nV: Ins\r\nfzfzfzfzfzfzfzfz|ffffffffffffffz2|Z2|\r\nV: Vocal\r\n\"Dmaj7\"F2c2c2c2BcBcc2c2|\"Dmaj7\"B2c2c2ccBcBcc2F2|\"Bm\"F4c4c4F2F2|\"Bm\"B4B2A2A2F4z2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#m\"B2c2B2A2A4B2A2|\"C#m\"B4c4e4c4|\"C#m\"f16|\r\nV: Ins\r\nZ3|\r\n% chorus\r\nV: Vocal\r\n\"F#m\"f2z2f2z2f2fff2e2|\"F#m\"c4z12|\"Dmaj7\"f2f2f2e2c4z2A2|\"E\"B4c4F4z4|\r\nV: Ins\r\nZ|z6Bcezeze2c2|Z2|\r\nV: Vocal\r\n\"F#m\"f2z2f2z2f2fff2e2|\"F#m\"c4z12|\"Dmaj7\"B2c2B2A2A4F4|\"E\"B4c8A4|\r\nV: Ins\r\nZ|z6Bcezeze2c2|Z2|\r\nV: Vocal\r\n\"F#m\"F16-|\"F#m\"F8z8|\r\nV: Ins\r\nZ2|\r\n% verse\r\nV: Vocal\r\n\"F#m\"FF2FF2F2FFF2FFFF|\"F#m\"FFF2FFF2F2FFF2F2|\"D\"FFFFFFFFFFF2FFFF|\"D\"F2FFF2F2FFFFFFFF|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Bm\"F2c2B2A2B4z4|\"Bm\"B4B2A2A4z4|\"C#m\"B4B2A2B2A2B4|\"C#m\"c2ccc2c2f8|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F#m\"fffff2e2c4z4|\"F#m\"c2c2c2e2c4c2c2|\"Dmaj7\"fffff2ccc2c2c2cc|\"Dmaj7\"c8z2c2B2A2|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Bm\"B4B4BBBAB2A2|\"Bm\"B4c4F2F4F2|\"C#m\"B2A2B8B2A2|\"C#m\"B4c4e2e2c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"F#m\"f16-|\"F#m\"f8z8|\"F#m\"FF2FFF2FFF2FFF2F|\"F#m\"FF2FFF2FFF2FFF2F|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D\"FF2FFF2FFF2FFF2F|\"D\"FF2FFF2FFF2FFF2F|\"Bm\"FF2FFF2FFF2FFF2F|\"Bm\"FF2FFF2FFF2FF3F|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#m\"FF2FFF2FFF2FFF2F|\"C#m\"FF2FFF2FFF2FF3F|\"F#m\"FF2FFF2FFF2FFF2F|\"F#m\"FF2FFF2FFF2FFF2F|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"D\"FF2FFF2FFF2FFF2F|\"D\"FF2FFF2FFF2FF4|\"Bm\"FF2FFF2FFF2FFF2F|\"Bm\"FF2FFF2FFF2FF4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"C#m\"FF2FFF2FFF2FFF2F|\"C#m\"FF2FF3FF3Fz4|\r\nV: Ins\r\nZ2|\r\n% chorus\r\nV: Vocal\r\n\"F#m\"f2z2f2z2f2fff2e2|\"F#m\"c4z12|\"Dmaj7\"f2f2f2e2c4z2A2|\"E\"B4c4F4z4|\r\nV: Ins\r\nZ|z6Bcezeze2c2|Z2|\r\nV: Vocal\r\n\"F#m\"f2z2f2z2f2fff2e2|\"F#m\"c4z12|\"Dmaj7\"B2c2B2A2A4F4|\"E\"B4c8A4|\r\nV: Ins\r\nZ|z6Bcezeze2c2|Z2|\r\nV: Vocal\r\n\"F#m\"F16-|\"F#m\"F8z8|\"Dmaj7\"B4c8z4|\"Dmaj7\"z8B4c4|\r\nV: Ins\r\nZ4|\r\nV: Vocal\r\n\"Dmaj7\"c4z12|\"Dmaj7\"B4A4A4F4|\"F#m\"F16-|\"F#m\"F8z8|\r\nV: Ins\r\nZ3|z8fz6z|\r\n% outro\r\nV: Vocal\r\n\"F#m\"z16|\"F#m\"z16|\"Dmaj7\"z16|\"Dmaj7\"z16|\r\nV: Ins\r\nf2fffzf2f2fff2e2|c2z4Bcezeze2c2|f2fffzf2f2fff2e2|c2z4Bcezeze2c2|\r\nV: Vocal\r\n\"Bm\"z16|\"Bm\"z16|\"C#m\"z16|\"C#m\"z16|\r\nV: Ins\r\nf2fffzf2f2fff2e2|c4z2Bcezeze2c2|f2fffzf2f2fff2e2|c4z2Bcezeze2c2|\r\nV: Vocal\r\n\"F#m\"z16|\"F#m\"z16|\r\nV: Ins\r\nZ2|";
let visual = null;
let visual0 = null;
let synthCtl = null;
let hlEls = []; // 当前高亮中的图层
let hlMiss = 0; // 高亮未命中计数（诊断）

function collectNotes() {
  // 音符总数（用于元信息展示，不再参与定位）
  return document.querySelectorAll("#score .abcjs-note").length;
}
function clearHighlight() {
  hlEls.forEach(function (l) { try { if (l && l.classList) l.classList.remove("playing"); } catch (x) {} });
  hlEls = [];
}
function highlightEvent(event) {
  if (!event || !event.elements || !event.elements.length) return false;
  clearHighlight();
  var hit = 0;
  // elements = 若干组，每组是一个数组，内含该音符的 SVG 元素（DOM 节点，有 classList）
  event.elements.forEach(function (group) {
    (Array.isArray(group) ? group : [group]).forEach(function (svgEl) {
      if (svgEl && svgEl.classList) {
        svgEl.classList.add("playing");
        hlEls.push(svgEl);
        hit++;
      }
    });
  });
  return hit > 0;
}
// 精确高亮：事件（由 abc 解析出的逐音符时序生成）自带该音符的绘制元素（layers），
// 直接给它们的 SVG 元素加 playing 类上色——零索引猜测、长音/装饰音/多声部天然对齐。
// 小节块高亮：当前小节（同系统三声部同列）所有音符保持亮，换小节/换行时整块切换
let hlLine = -1;
let hlMeasure = -1;
const CURSOR = {
  beatSubdivisions: 4,
  onStart: clearHighlight,
  onFinished: clearHighlight,
  onBeat: function () {},
  onEvent: function (evt) {
    if (!evt) { clearHighlight(); return; } // null = 播放结束
    var mv = typeof evt.measureNumber === "number" ? evt.measureNumber : -1;
    var lv = typeof evt.line === "number" ? evt.line : -1;
    if (mv !== hlMeasure || lv !== hlLine) {
      clearHighlight();
      hlMeasure = mv;
      hlLine = lv;
    }
    var ok = highlightEvent(evt);
    if (!ok && hlMiss++ < 3) {
      var m = document.getElementById("meta");
      if (m) m.textContent = ("诊断: 事件元素数=" + (evt.elements ? evt.elements.length : 0) + "，未找到可用 SVG 引用（高亮未生效）");
    }
  },
  onLineEnd: function () {}
};

function fixSvg() {
  // abcjs 为多声部每行生成一个 svg（内含两条五线谱），其 viewBox 高度未覆盖全部内容，
  // 长谱会裁掉末尾的 Ins 声部。用 getBBox() 实测内容包围盒、按真实内容重设 viewBox，
  // 再让高度由 viewBox 比例决定，保证整行完整显示。
  Array.prototype.forEach.call(document.querySelectorAll("#score svg"), function (svg) {
    var bb = null;
    try { bb = svg.getBBox(); } catch (e) {}
    if (bb && bb.width > 0 && bb.height > 0) {
      svg.setAttribute("viewBox", [bb.x, bb.y, bb.width, bb.height].join(" "));
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.display = "block";
  });
}
function rerender() {
  const el = document.getElementById("score");
  el.innerHTML = "";
  visual = ABCJS.renderAbc("score", ABC_TEXT, { add_classes: true, responsive: "resize", scale: 0.95, print: true });
  visual0 = visual && visual[0];
  fixSvg();
  const nCount = collectNotes();
  const mt = (visual0 && visual0.metaText) || {};
  const shown = (mt.title ? mt.title + "  ·  " : "") + (visual0 ? visual0.lines.length + " 行" : "?") + " · 调号 " + (mt.key || "?") + " · 速度 " + (mt.tempo || "?") + " · 音符 " + nCount;
  document.getElementById("meta").textContent = shown || "曲谱已渲染";
}

function getSynth() {
  if (!synthCtl) {
    synthCtl = new ABCJS.synth.SynthController();
    synthCtl.load("#ctl", CURSOR, { displayPlay: true, displayProgress: true, displayRestart: true, displayLoop: false, displayWarp: false });
  }
  return synthCtl;
}
function playScore() {
  try {
    if (!visual0) rerender();
    stopScore();
    const ctl = getSynth();
    ctl.setTune(visual0).then(function () { ctl.play(); }).catch(function (e) { alert("播放失败: " + (e && e.message ? e.message : e)); });
  } catch (e) { alert("播放失败: " + e.message); }
}
function stopScore() {
  try { if (synthCtl) synthCtl.pause(); } catch (e) {}
  clearHighlight();
}
renderReady();
function renderReady() { rerender(); }
</script></body></html>
